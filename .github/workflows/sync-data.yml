name: Sync archive data

on:
  schedule:
    # 매주 월요일 09:00 KST (= 월요일 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: {}   # 급할 때 Actions 탭에서 "Run workflow" 버튼으로 즉시 실행

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch & filter data
        env:
          ARCHIVE_API: ${{ secrets.ARCHIVE_API_URL }}
        run: python scripts/sync_data.py

      - name: Commit if changed
        run: |
          git config user.name "haedal-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/works.js data/exhibitions.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: weekly data sync ($(date -u +%Y-%m-%d))"
            git push
          fi
