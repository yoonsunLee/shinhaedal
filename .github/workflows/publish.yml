name: Publish archive data

on:
  repository_dispatch:
    types: [archive-publish]
  workflow_dispatch: {}   # Actions 탭에서 수동 실행
  schedule:
    # 매일 09:00 KST (= 00:00 UTC) — 관리자 패널 발행 버튼을 못 눌렀을 때 대비한 백업
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Fetch, filter & build derivatives
        env:
          ARCHIVE_API: ${{ secrets.ARCHIVE_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ARCHIVE_ADMIN_TOKEN }}
        run: python scripts/publish.py

      - name: Commit if changed
        run: |
          git config user.name "haedal-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ assets/works/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: publish archive data ($(date -u +%Y-%m-%d))"
            git push
          fi
