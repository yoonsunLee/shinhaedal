name: Publish archive data

on:
  repository_dispatch:
    types: [archive-publish]
  # 이 파일을 고쳐 올리면 그 자리에서 한 번 돌아 바뀐 설정을 확인한다(서버·부품 버전을 바꿀 때).
  # 발행은 내용이 같으면 아무것도 바꾸지 않으므로 한 번 더 돌아도 안전하다.
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:      # Actions 탭에서 수동 실행
    inputs:
      allow_shrink:
        description: '작품 수 급감·Press 0건이어도 발행 (일부러 대량 비공개/삭제했을 때만 체크)'
        type: boolean
        default: false
  schedule:
    # 매일 00:05 KST (= 15:05 UTC) — 발행 버튼을 못 눌렀을 때 대비한 백업.
    # 날짜가 바뀐 직후에 돌아야 전시 시작·종료처럼 날짜에 따라 달라지는 정적 HTML(작품 페이지의
    # 전시 이력, 미리 쓴 목록)이 그날 하루 종일 맞는다(예전 09:00엔 아침 9시간 동안 전날 기준이었다).
    - cron: '5 15 * * *'

permissions:
  contents: write

# 발행 버튼을 연달아 누르거나 자동 발행과 겹쳐도 한 번에 하나씩만 돈다(서로의 커밋을 덮어쓰지 않도록)
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # ubuntu-latest 는 2026-10-19 부터 몇 주에 걸쳐 섞여 가며 Ubuntu 26.04 로 바뀐다(GitHub 공지) — 그동안은 날마다
    # 24·26 중 어디서 돌지 모른다. 그래서 26.04 를 직접 적어 두고, 옮긴 날 바로 한 번 돌려 확인했다(2026-10-11).
    # 문제가 생기면 ubuntu-24.04 로 되돌리면 된다(2029년까지 지원).
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # 기본값(360분)까지 매달려 있지 않도록 — 평소엔 몇 분이면 끝남
    steps:
      - uses: actions/checkout@v7       # Node 24 (v4 는 지원 끝난 Node 20)
        with:
          # 버튼을 누른 순간이 아니라 '차례가 와서 시작한 순간'의 main 에서 만든다. 반영을 연달아 누르면 뒤 발행이
          # 앞 발행이 올린 결과보다 옛 상태에서 만들어 커밋할 때 충돌로 실패했다(2026-10-25 #163)
          ref: main

      - uses: actions/setup-python@v7   # Node 24
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests Pillow

      # 홈 영상·도슨트 음성은 ffmpeg로 만든다. 러너 이미지에 없어서 매번 apt 로 설치하는데,
      # 그 서버가 느린 날은 17~20분이 걸려 작업 전체가 20분 제한에 잘렸다(10/2·10/7·10/8 —
      # 두 번은 발행이 통째로 날아감). 8분에서 끊고, 설치를 못 해도 발행은 계속한다.
      # 이미 만든 영상은 source.txt 로 재사용하므로 ffmpeg 가 필요 없고, 새로 만들어야 하는
      # 영상·음성만 그날 건너뛰었다가 다음 발행 때 다시 만든다(publish_sb.py).
      - name: Ensure ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # 아카이브 원본은 Supabase에 있다. service_role 키는 RLS를 우회하므로
      # 반드시 서버(Actions secret)에만 두고 브라우저에는 넣지 않는다.
      - name: Fetch, filter & build derivatives
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/publish_sb.py

      # 발행물이 비었으면 커밋하지 않는다. 일시적 실패로 살아있는 공개 데이터를
      # 빈 배열로 덮어쓰는 사고를 막는다.
      - name: Sanity check before commit
        env:
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          allow_shrink = os.environ.get('ALLOW_SHRINK') == 'true'

          def prev_count(path):
              # 직전 커밋(= 지금 공개 중인 데이터)의 건수. 파일이 없던 최초 발행이면 None.
              try:
                  return len(json.loads(subprocess.check_output(['git', 'show', 'HEAD:' + path])))
              except Exception:
                  return None

          idx = json.load(open('data/works-index.json', encoding='utf-8'))
          ex  = json.load(open('data/exhibitions.json', encoding='utf-8'))
          pr  = json.load(open('data/press.json', encoding='utf-8'))
          if len(idx) == 0:
              sys.exit('작품이 0건 — 발행 중단')
          if len(ex) == 0:
              sys.exit('전시가 0건 — 발행 중단')
          hint = ' 일부러 줄인 거라면 Actions 탭에서 allow_shrink를 체크하고 수동 실행하세요.'
          prev_works = prev_count('data/works-index.json')
          if not allow_shrink and prev_works and prev_works >= 4 and len(idx) < prev_works * 0.5:
              sys.exit('작품 수 급감(%d → %d건) — 발행 중단.%s' % (prev_works, len(idx), hint))
          prev_press = prev_count('data/press.json')
          if not allow_shrink and prev_press and len(pr) == 0:
              sys.exit('Press가 0건(직전 %d건) — 발행 중단.%s' % (prev_press, hint))
          missing = [r['id'] for r in idx if not r.get('thumb')]
          if missing:
              sys.exit('썸네일 없는 작품: %s — 발행 중단' % missing)
          # 홈 영상은 0건이어도 정상(이미지 히어로로 폴백)이라 개수는 안 막는다.
          # 대신 공개(public)인데 영상 파일이 비어있는 건 깨진 상태이므로 막는다.
          try:
              hv = json.load(open('data/home-videos.json', encoding='utf-8'))
          except FileNotFoundError:
              hv = []
          broken = [r['id'] for r in hv if r.get('public') and not r.get('video')]
          if broken:
              sys.exit('영상 파일 없는 공개 홈 영상: %s — 발행 중단' % broken)
          print('검사 통과: 작품 %d건, 전시 %d건, Press %d건, 홈 영상 %d건' % (len(idx), len(ex), len(pr), len(hv)))
          PY

      # 공개 작품마다 개별 작품 페이지(works/w/ID/) + 공유용 og:image를 다시 만들고,
      # 작품 목록·홈 Recent·Press 목록을 HTML에 미리 쓰고(prerender_lists.py), 영문 페이지(en/, build_en.py —
      # 러너에 기본으로 있는 node로 페이지의 I18N을 읽는다)를 다시 만들고, sitemap.xml을 갱신한다.
      # 목록에서 빠진(비공개·삭제) 작품의 페이지도 여기서 같이 정리된다.
      - name: Generate work pages, prerendered lists, sitemap
        run: python scripts/gen_work_share.py --all

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "haedal-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p assets/exhibitions assets/home-video assets/home-hero
          git add data/ assets/works/ assets/exhibitions/ assets/home-video/ assets/home-hero/ works/w/ sitemap.xml en/ \
                  index.html works/index.html press/index.html about/index.html cv/index.html contact/index.html privacy/index.html ip/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: publish archive data ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            # 발행하는 사이에 다른 커밋(디자인 수정 등)이 올라왔으면 그 위에 얹는다
            git pull --rebase --quiet
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # 바뀐 페이지만 검색엔진(Bing·네이버)에 바로 알린다. 구글은 IndexNow를 받지 않아 사이트맵으로 찾아온다.
      # GitHub Pages 배포가 끝난 뒤 알려야 새 내용을 가져가므로 잠시 기다린다. 실패해도 발행은 성공으로 둔다.
      - name: Notify search engines (IndexNow)
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: |
          sleep 90
          python scripts/indexnow.py HEAD~1 HEAD
