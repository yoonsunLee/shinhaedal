<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배경 시안 B — 다이내믹 그리드 (비공개, git 미커밋)</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --bg:#0b0b0f; --bg-2:#111420; --navy:#1b2a4a; --gold:#c9a227; --gold-dim:rgba(201,162,39,0.35);
    --ivory:#f5f0e6; --ivory-dim:rgba(245,240,230,0.62); --ivory-faint:rgba(245,240,230,0.32);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ivory); font-family:'Noto Sans KR', sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow:hidden;}
  #bg{position:fixed; inset:0; z-index:0; display:block;}
  .note{position:relative; z-index:2; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); border-bottom:1px solid var(--gold-dim); padding:14px 32px; font-family:'Space Mono','Noto Sans KR',monospace; font-size:11.5px; color:var(--ivory-faint); line-height:1.6;}
  .stage{position:relative; z-index:1; max-width:900px; margin:14vh auto 0; padding:0 32px; text-align:center;}
  .eyebrow{font-family:'Space Mono','Noto Sans KR',monospace; font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin-bottom:18px;}
  h1{font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:clamp(32px,6vw,64px); margin:0 0 16px; letter-spacing:1px;}
  p.sub{color:var(--ivory-dim); font-size:15px; line-height:1.7; max-width:520px; margin:0 auto;}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="note">
  배경 시안 B — 다이내믹 그리드/메시 (실제 사이트와 연결 안 됨, git 미커밋). 격자선이 파도처럼 서서히 출렁이고, 교차점 위로 은은한 골드 광점이 흘러갑니다. 마우스를 움직이면 격자가 살짝 눌리듯 반응합니다.
</div>

<div class="stage">
  <div class="eyebrow">SHIN HAEDAL — Najeonchilgi Artist</div>
  <h1>ⓒSHIN HAEDAL</h1>
  <p class="sub">이 텍스트 영역 위에 실제 콘텐츠(로고·헤드라인·CTA)가 얹힌다고 가정하고 배경 움직임을 확인하세요.</p>
</div>

<script>
(function(){
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildGrid();
  }
  window.addEventListener('resize', resize);

  var COLS, ROWS, cellW, cellH, pts;
  function buildGrid(){
    var target = 46; // approx px between lines at base
    COLS = Math.max(10, Math.round(W / target));
    ROWS = Math.max(8, Math.round(H / target));
    cellW = W / COLS; cellH = H / ROWS;
    pts = [];
    for (var j=0;j<=ROWS;j++){
      var row = [];
      for (var i=0;i<=COLS;i++){
        row.push({ bx:i*cellW, by:j*cellH, x:0, y:0 });
      }
      pts.push(row);
    }
  }

  var mouseX = -9999, mouseY = -9999, targetMX = -9999, targetMY = -9999;
  window.addEventListener('mousemove', function(e){ targetMX = e.clientX; targetMY = e.clientY; });
  window.addEventListener('mouseleave', function(){ targetMX = -9999; targetMY = -9999; });

  // traveling glow pulses along the grid
  var pulses = [];
  function spawnPulse(){
    var alongRow = Math.random() < 0.5;
    pulses.push({
      alongRow: alongRow,
      idx: alongRow ? Math.floor(Math.random()*(ROWS+1)) : Math.floor(Math.random()*(COLS+1)),
      p: 0,
      speed: 0.12 + Math.random()*0.08,
      dir: Math.random() < 0.5 ? 1 : -1
    });
  }
  var nextPulseAt = 1.5;

  var t0 = performance.now();
  var lastT = t0;

  function frame(now){
    var t = (now - t0) / 1000;
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    mouseX += (targetMX - mouseX) * 0.08;
    mouseY += (targetMY - mouseY) * 0.08;

    // base background
    var g = ctx.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.35, Math.max(W,H)*0.85);
    g.addColorStop(0, '#151a2c');
    g.addColorStop(1, '#08080c');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // displace grid points: two overlapping sine waves + mouse ripple
    var freq1 = 0.010, freq2 = 0.016;
    for (var j=0;j<pts.length;j++){
      for (var i=0;i<pts[j].length;i++){
        var pt = pts[j][i];
        var wave = reduceMotion ? 0 :
          Math.sin(pt.bx*freq1 + t*0.6) * 10 +
          Math.cos(pt.by*freq2 + t*0.5) * 10 +
          Math.sin((pt.bx+pt.by)*0.006 + t*0.35) * 6;
        var dx = 0, dy = 0;
        if (!reduceMotion && mouseX > -1000){
          var ddx = pt.bx - mouseX, ddy = pt.by - mouseY;
          var dist = Math.sqrt(ddx*ddx + ddy*ddy);
          var influence = Math.max(0, 1 - dist / 220);
          if (influence > 0){
            var push = influence * influence * 22;
            var ang = Math.atan2(ddy, ddx);
            dx = Math.cos(ang) * -push;
            dy = Math.sin(ang) * -push;
          }
        }
        pt.x = pt.bx + dx;
        pt.y = pt.by + wave + dy;
      }
    }

    // draw grid lines
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(201,162,39,0.14)';
    for (var j=0;j<pts.length;j++){
      ctx.beginPath();
      for (var i=0;i<pts[j].length;i++){
        var pt = pts[j][i];
        if (i===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(245,240,230,0.06)';
    for (var i=0;i<=COLS;i++){
      ctx.beginPath();
      for (var j=0;j<pts.length;j++){
        var pt2 = pts[j][i];
        if (j===0) ctx.moveTo(pt2.x, pt2.y); else ctx.lineTo(pt2.x, pt2.y);
      }
      ctx.stroke();
    }

    // faint intersection dots
    ctx.fillStyle = 'rgba(245,240,230,0.10)';
    for (var j=0;j<pts.length;j++){
      for (var i=0;i<pts[j].length;i++){
        var d = pts[j][i];
        ctx.beginPath();
        ctx.arc(d.x, d.y, 1, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // traveling glow pulses
    if (!reduceMotion){
      nextPulseAt -= dt;
      if (nextPulseAt <= 0 && pts.length){ spawnPulse(); nextPulseAt = 1.2 + Math.random()*1.2; }
      pulses.forEach(function(pl){ pl.p += pl.speed * dt * 4; });
      pulses = pulses.filter(function(pl){ return pl.p < 1.05; });

      pulses.forEach(function(pl){
        var line = pl.alongRow ? pts[pl.idx] : pts.map(function(r){ return r[pl.idx]; });
        if (!line) return;
        var progress = pl.dir > 0 ? pl.p : 1 - pl.p;
        var fIdx = progress * (line.length - 1);
        var idx0 = Math.floor(fIdx);
        var idx1 = Math.min(line.length - 1, idx0 + 1);
        var frac = fIdx - idx0;
        var a = line[idx0], b = line[idx1];
        if (!a || !b) return;
        var px = a.x + (b.x - a.x) * frac;
        var py = a.y + (b.y - a.y) * frac;
        var fade = Math.sin(pl.p * Math.PI);
        var glow = ctx.createRadialGradient(px, py, 0, px, py, 14);
        glow.addColorStop(0, 'rgba(201,162,39,' + (0.55*fade) + ')');
        glow.addColorStop(1, 'rgba(201,162,39,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, 14, 0, Math.PI*2);
        ctx.fill();
      });
    }

    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
