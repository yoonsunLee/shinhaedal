<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIN HAEDAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0f;
    --bg-2:#111420;
    --navy:#1b2a4a;
    --gold:#c9a227;
    --gold-dim:rgba(201,162,39,0.35);
    --ivory:#f5f0e6;
    --ivory-dim:rgba(245,240,230,0.62);
    --ivory-faint:rgba(245,240,230,0.32);
    --status-ok-bg:#1f4d3a; --status-ok-fg:#8fe0b8;
    --status-done-bg:#5c2323; --status-done-fg:#f0a6a6;
    --status-nfs-bg:#4a3a22; --status-nfs-fg:#e0c48f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ivory);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* nav */
  nav{
    position:relative; z-index:3;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:26px 32px; max-width:1180px; margin:0 auto;
  }
  .logo-block{display:flex; flex-direction:column; gap:5px;}
  .logo{font-family:'Black Han Sans', sans-serif; font-size:20px; letter-spacing:1px; color:var(--ivory);}
  .nav-icons{display:flex; align-items:center; gap:16px; padding-top:2px;}
  .lang{display:flex; border:1px solid var(--ivory-faint); border-radius:20px; overflow:hidden;}
  .lang button{border:none; background:transparent; color:var(--ivory-dim); cursor:pointer; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:6px 12px;}
  .lang button.on{background:var(--ivory); color:var(--bg);}
  .nav-menu{display:flex; gap:24px; list-style:none; margin:0 8px 0 0; padding:0; align-items:center;}
  .nav-menu a{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.5px; color:var(--ivory-dim); text-decoration:none;}
  .nav-menu a:hover, .nav-menu a.on{color:var(--ivory);}
  .nav-menu .soon{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.5px; color:var(--ivory-faint); cursor:default;}
  .menu-btn{display:none;}
  .nav-overlay{position:fixed; inset:0; background:rgba(6,7,12,.97); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center;}
  .nav-overlay.open{display:flex;}
  .overlay-close{position:absolute; top:22px; right:24px; font-size:20px;}
  .overlay-links{display:flex; flex-direction:column; gap:26px; text-align:center;}
  .overlay-links a, .overlay-links .soon{font-family:'Black Han Sans',sans-serif; font-size:26px; color:var(--ivory); text-decoration:none;}
  .overlay-links .soon{color:var(--ivory-faint);}
  .overlay-links .overlay-ig{font-family:'Space Mono',monospace; font-size:13px; color:var(--ivory-dim); margin-top:10px;}
  @media(max-width:720px){ .nav-menu{display:none;} .menu-btn{display:flex;} }
  .icon-btn{background:none; border:none; color:var(--ivory); cursor:pointer; display:flex; padding:4px; opacity:0.85;}
  .icon-btn:hover{opacity:1;}

  /* hero */
  header.hero{
    position:relative; overflow:hidden;
    min-height:88vh;
    display:flex; flex-direction:column; justify-content:flex-end;
    margin-top:-86px; /* let canvas run behind nav too */
    padding-top:86px;
    background:#05050a;
  }
  #bg-canvas{
    position:absolute; inset:0; width:100%; height:100%; z-index:0;
    image-rendering:pixelated;
  }
  .scanlines{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background-image:repeating-linear-gradient(rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply; opacity:0.45;
  }
  .grain{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background-image:radial-gradient(circle, rgba(245,240,230,0.7) 1px, transparent 1.3px);
    background-size:3px 3px; opacity:0.05;
  }
  .vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(0,0,0,0.6) 100%);
  }
  .hero-inner{
    position:relative; z-index:2;
    max-width:1180px; margin:0 auto; width:100%;
    padding:0 32px 64px;
  }
  .statement{
    font-family:'Black Han Sans', sans-serif; font-weight:400;
    font-size:clamp(38px, 6.6vw, 82px);
    line-height:1.16;
    margin:0;
    color:var(--ivory);
  }
  .statement .accent{
    background:linear-gradient(100deg,#ffb6d9,#9fe7ff,#c9b6ff,#ffd97a,#ffb6d9);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sheen 7s linear infinite;
  }
  @keyframes sheen{ to{ background-position:300% 0; } }

  .scroll-cue{
    display:flex; align-items:center; gap:8px; margin-top:36px;
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:1.5px;
    color:var(--ivory-faint);
  }
  .scroll-cue .arrow{animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }


  /* grid */
  .grid-section{max-width:1180px; margin:0 auto; padding:56px 32px 100px;}
  .grid-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:28px;}
  .grid-head h2{font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:22px; margin:0;}
  .grid-head span{font-family:'Space Mono', monospace; font-size:12px; color:var(--ivory-faint);}

  .work-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:34px 14px;}
  .tile{
    display:block; width:100%;
    cursor:pointer; border:none; background:none; padding:0; text-align:left;
  }
  .tile-media{position:relative; aspect-ratio:1/1; overflow:hidden; border-radius:2px; background:var(--bg-2);}
  .tile-media img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s ease;}
  .tile:hover .tile-media img{transform:scale(1.03);}
  .tile-sheen{
    position:absolute; inset:0; opacity:0;
    background:
      radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1.4px) 0 0/16px 16px,
      linear-gradient(125deg,#ffb6d9,#9fe7ff,#c9b6ff,#ffd97a,#ffb6d9) 0 0/320% 320%;
    background-blend-mode:normal, screen;
    mix-blend-mode:screen;
    transition:opacity .5s ease, background-position 1.4s ease;
  }
  .tile:hover .tile-sheen{opacity:.22; background-position:0 0, 100% 60%;}
  .tile.loading{display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; border-radius:2px; background:var(--bg-2); cursor:default;}
  .tile.loading span{font-family:'Space Mono',monospace; font-size:11px; color:var(--ivory-faint);}
  .tile-cap{padding-top:12px;}
  .tile-title{font-size:13px; color:var(--ivory-dim); font-weight:500; line-height:1.4;}

  .works-more{text-align:center; margin-top:30px;}
  .works-more a{
    display:inline-block;
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:1.5px;
    color:var(--ivory-dim); background:none; border:1px solid var(--ivory-faint);
    border-radius:24px; padding:11px 26px; cursor:pointer; text-decoration:none;
  }
  .works-more a:hover{color:var(--ivory); border-color:var(--ivory-dim);}

  @media(max-width:720px){
    .work-grid{grid-template-columns:repeat(2, 1fr); gap:26px 14px;}
  }

  /* work modal */
  .work-modal-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(5,5,8,0.86);
    display:flex; align-items:center; justify-content:center;
    padding:40px;
    opacity:0; pointer-events:none;
    transition:opacity .22s ease;
  }
  .work-modal-overlay.open{opacity:1; pointer-events:auto;}
  .work-modal{
    position:relative;
    width:100%; max-width:1040px; max-height:86vh;
    background:var(--bg-2);
    border-radius:10px;
    display:flex; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transform:translateY(14px) scale(.98);
    transition:transform .22s ease;
  }
  .work-modal-overlay.open .work-modal{transform:translateY(0) scale(1);}

  .wm-handle{display:none;}

  .wm-media{
    position:relative;
    flex:1 1 56%; background:#05050a;
    display:flex; align-items:center; justify-content:center;
    min-width:0;
  }
  .wm-media img{max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain;}

  .wm-close,.wm-nav{
    position:absolute; z-index:2;
    background:rgba(11,11,15,.55); border:none; color:var(--ivory);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    border-radius:50%; line-height:1;
  }
  .wm-close{top:12px; right:12px; width:32px; height:32px; font-size:15px;}
  .wm-nav{top:50%; transform:translateY(-50%); width:38px; height:38px; font-size:20px;}
  .wm-prev{left:12px;} .wm-next{right:12px;}
  .wm-close:hover,.wm-nav:hover{background:rgba(11,11,15,.85);}

  .wm-info{
    flex:1 1 44%; min-width:0; max-width:420px;
    padding:34px 32px; overflow-y:auto;
    display:flex; flex-direction:column; gap:16px;
  }
  .wm-title-primary{font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:22px; color:var(--ivory); line-height:1.3;}
  .wm-title-secondary{font-family:'Space Mono',monospace; font-size:12px; color:var(--ivory-faint); margin-top:5px;}
  .wm-spec{font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ivory-dim); letter-spacing:.3px;}
  .wm-caption{font-size:14px; line-height:1.7; color:var(--ivory-dim); margin:0; white-space:pre-line;}
  .wm-exhibitions{border-top:1px solid var(--gold-dim); padding-top:14px;}
  .wm-ex-label{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:var(--ivory-faint); margin-bottom:8px; text-transform:uppercase;}
  .wm-ex-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .wm-ex-list li{font-size:12.5px; color:var(--ivory-dim); line-height:1.5;}
  .wm-ex-toggle{margin-top:10px; background:none; border:none; padding:0; color:var(--gold); font-family:'Space Mono',monospace; font-size:11.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}

  @media(max-width:820px){
    .work-modal-overlay{padding:0; align-items:flex-end;}
    .work-modal{
      max-width:none; width:100%; max-height:78vh;
      border-radius:16px 16px 0 0;
      flex-direction:column;
      transform:translateY(100%);
    }
    .wm-handle{display:block; width:36px; height:4px; border-radius:2px; background:var(--ivory-faint); margin:10px auto 0;}
    .wm-media{flex:0 0 auto; height:34vh;}
    .wm-info{max-width:none; flex:1 1 auto; padding:18px 20px 28px;}
  }
</style>
</head>
<body>

<header class="hero">
  <!-- 배경 자리표시자: 실제 촬영 영상(작업 과정, 빛에 반사되는 자개 클로즈업 등)이 있으면
       #bg-canvas를 <video autoplay muted loop playsinline> 로 교체하고,

<script>
/* ---------- 언어 토글 (KO/EN) ---------- */
var I18N = {
  ko: {
    statement:'쉽게 들어와서<br><span class="accent">오래 머무는</span> 작업',
    loading:'불러오는 중…',
    empty:'등록된 작품이 아직 없어요',
    error:'작품을 불러오지 못했어요',
    browse_all:'모든 작품 보기 →'
  },
  en: {
    statement:'Easy to walk into,<br><span class="accent">hard to walk away from</span>.',
    loading:'Loading…',
    empty:'No works registered yet',
    error:'Could not load works',
    browse_all:'Browse all works →'
  }
};
var LANG = 'ko';
try{ if(localStorage.getItem('site_lang')==='en') LANG='en'; }catch(e){}
function applyLang(l){
  LANG = l;
  try{ localStorage.setItem('site_lang', l); }catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = I18N[l][el.dataset.i];
    if(v!==undefined) el.innerHTML = v;
  });
  document.getElementById('langKo').classList.toggle('on', l==='ko');
  document.getElementById('langEn').classList.toggle('on', l==='en');
  if(typeof renderWorkTiles==='function' && typeof ALL_WORKS!=='undefined' && ALL_WORKS.length) renderWorkTiles(ALL_WORKS.slice(0, 6));
  if(typeof renderWorkModal==='function' && document.getElementById('workModal').classList.contains('open')) renderWorkModal();
}
document.getElementById('langKo').onclick = function(){ applyLang('ko'); };
document.getElementById('langEn').onclick = function(){ applyLang('en'); };
if(LANG!=='ko') applyLang(LANG);
</script>

<script>
/* ---------- 해달아카이브 연동 (공개 필드만) ---------- */
var ARCHIVE_API = 'https://script.google.com/macros/s/AKfycbxpI_YNIOKVfk76Z_dVVN1oHlfnGfO0EJ9xEub2IxHOnNtdFKquHQDT8Xayzv1umQto/exec';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function archiveImgUrl(v, size){
  v = String(v||'').trim();
  if(!v) return '';
  var m;
  if(/^drive:/.test(v)) return 'https://drive.google.com/thumbnail?id=' + v.slice(6) + '&sz=w' + (size||900);
  m = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|thumbnail\?id=)([\w-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w' + (size||900);
  if(/^https?:\/\//.test(v)) return v;
  return '';
}
function primaryTitle(r){
  var lines = String(r.title||'').replace(/[\r]/g,'\n').split('\n');
  var ko = (lines[0] || '').trim();
  var en = (lines[1] || '').trim();
  return LANG === 'en' ? (en || ko) : (ko || en);
}
function renderWorkTiles(rows){
  var grid = document.getElementById('workGrid');
  if(!rows.length){
    grid.innerHTML = '<div class="tile loading"><span data-i="empty">' + I18N[LANG].empty + '</span></div>';
    return;
  }
  grid.innerHTML = rows.map(function(r, i){
    var img = archiveImgUrl(r.image, 900);
    var media = img ? '<img src="' + img.replace(/"/g,'&quot;') + '" alt="" loading="lazy">' : '';
    return '<figure class="tile" data-idx="' + i + '">' +
      '<div class="tile-media">' + media + '<div class="tile-sheen"></div></div>' +
      '<figcaption class="tile-cap"><span class="tile-title">' + esc(primaryTitle(r)) + '</span></figcaption>' +
      '</figure>';
  }).join('');
}
var ALL_WORKS = [];
function loadRecentWorks(){
  fetch(ARCHIVE_API + '?t=' + Date.now())
    .then(function(res){ return res.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error || '응답 오류');
      var rows = (j.rows || [])
        .filter(function(r){ return String(r.title||'').trim(); })
        .filter(function(r){ return !/^ER/i.test(String(r.no||'').trim()); });
      rows = rows.slice().reverse(); // 최근 등록순(시트 하단이 최신)
      var seenTitles = {};
      ALL_WORKS = rows.filter(function(r){
        var key = String(r.title||'').trim();
        if(seenTitles[key]) return false;
        seenTitles[key] = true;
        return true;
      });
      renderWorkTiles(ALL_WORKS.slice(0, 6));
      if(ALL_WORKS.length > 6) document.getElementById('btnMoreWorks').hidden = false;
    })
    .catch(function(e){
      console.error('아카이브 연동 실패:', e);
      document.getElementById('workGrid').innerHTML =
        '<div class="tile loading"><span data-i="error">' + I18N[LANG].error + '</span></div>';
    });
}
loadRecentWorks();

document.getElementById('workGrid').addEventListener('click', function(e){
  var tile = e.target.closest('.tile[data-idx]');
  if(!tile) return;
  openWorkModal(parseInt(tile.dataset.idx, 10));
});
</script>

<script>
/* ---------- 작품 상세 팝업 ---------- */
var wmModal = document.getElementById('workModal');
var wmIndex = -1;

function cleanText(s){
  return String(s==null?'':s).replace(/[\r]/g, '\n');
}
function exhibitionLines(str){
  return cleanText(str).split('\n').map(function(s){
    return s.replace(/\t+/g, '   ').trim();
  }).filter(Boolean);
}
function renderWorkModal(){
  var w = ALL_WORKS[wmIndex];
  if(!w) return;

  var titleLines = cleanText(w.title).split('\n');
  var ko = (titleLines[0] || '').trim();
  var en = (titleLines[1] || '').trim();
  var primary = LANG === 'en' ? (en || ko) : (ko || en);
  var secondary = LANG === 'en' ? ko : en;
  document.getElementById('wmTitlePrimary').textContent = primary;
  var secEl = document.getElementById('wmTitleSecondary');
  secEl.textContent = secondary;
  secEl.style.display = (secondary && secondary !== primary) ? '' : 'none';

  var specParts = [w.material, w.size, w.year].map(function(v){ return String(v==null?'':v).trim(); }).filter(Boolean);
  document.getElementById('wmSpec').textContent = specParts.join(' · ');

  document.getElementById('wmCaption').textContent = cleanText(w.caption);

  var exWrap = document.getElementById('wmExhibitions');
  var exList = document.getElementById('wmExList');
  var toggle = document.getElementById('wmExToggle');
  var lines = exhibitionLines(w.exhibitions);
  var LIMIT = 3;
  if(!lines.length){
    exWrap.hidden = true;
  }else{
    exWrap.hidden = false;
    exList.innerHTML = lines.map(function(l, i){
      return '<li' + (i >= LIMIT ? ' class="wm-ex-extra" hidden' : '') + '>' + esc(l) + '</li>';
    }).join('');
    if(lines.length > LIMIT){
      toggle.hidden = false;
      toggle.dataset.open = 'false';
      toggle.textContent = '전시 이력 더보기 (' + lines.length + ')';
    }else{
      toggle.hidden = true;
    }
  }

  var imgEl = document.getElementById('wmImg');
  imgEl.src = archiveImgUrl(w.image, 1600);
  imgEl.alt = primary;
}
function openWorkModal(idx){
  if(!ALL_WORKS[idx]) return;
  wmIndex = idx;
  renderWorkModal();
  wmModal.classList.add('open');
  wmModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeWorkModal(){
  wmModal.classList.remove('open');
  wmModal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
function stepWorkModal(delta){
  if(!ALL_WORKS.length) return;
  wmIndex = (wmIndex + delta + ALL_WORKS.length) % ALL_WORKS.length;
  renderWorkModal();
}
document.getElementById('wmClose').onclick = closeWorkModal;
document.getElementById('wmPrev').onclick = function(){ stepWorkModal(-1); };
document.getElementById('wmNext').onclick = function(){ stepWorkModal(1); };
wmModal.addEventListener('click', function(e){ if(e.target === wmModal) closeWorkModal(); });
document.getElementById('wmExToggle').onclick = function(){
  var isOpen = this.dataset.open === 'true';
  document.querySelectorAll('#wmExList .wm-ex-extra').forEach(function(li){ li.hidden = isOpen; });
  this.dataset.open = isOpen ? 'false' : 'true';
  this.textContent = isOpen
    ? '전시 이력 더보기 (' + exhibitionLines(ALL_WORKS[wmIndex].exhibitions).length + ')'
    : '접기';
};
document.addEventListener('keydown', function(e){
  if(!wmModal.classList.contains('open')) return;
  if(e.key === 'Escape') closeWorkModal();
  else if(e.key === 'ArrowLeft') stepWorkModal(-1);
  else if(e.key === 'ArrowRight') stepWorkModal(1);
});
</script>

<script>
(function(){
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var hero = document.querySelector('.hero');
  var SCALE = 6; // internal render scale-down -> CSS upscales with pixelated rendering for a retro low-res feel
  var w, h, particles;
  var colors = ['#c9a227','#c9a227','#f5f0e6','#f5f0e6','#ffb6d9','#9fe7ff','#c9b6ff'];

  function resize(){
    w = Math.max(60, Math.floor(hero.clientWidth / SCALE));
    h = Math.max(40, Math.floor(hero.clientHeight / SCALE));
    canvas.width = w; canvas.height = h;
  }
  function initParticles(){
    particles = [];
    var count = 80;
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        size: Math.random()<0.18 ? 2 : 1,
        speed: 0.03 + Math.random()*0.07,
        drift: Math.random()*Math.PI*2,
        color: colors[Math.floor(Math.random()*colors.length)]
      });
    }
  }
  function tick(t){
    var grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#161c2c');
    grad.addColorStop(1,'#07070b');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.y -= p.speed;
      p.x += Math.sin((t/1800)+p.drift)*0.03;
      if(p.y < -2){ p.y = h+2; p.x = Math.random()*w; }
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  resize();
  initParticles();
  requestAnimationFrame(tick);
})();
</script>
