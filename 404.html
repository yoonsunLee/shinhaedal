<style>
  /* 404 page — GitHub Pages는 이 파일을 실제 요청 경로 그대로 서빙하므로
     (예: /works/foo → /404.html), 모든 리소스·링크는
     상대경로가 아니라 / 로 시작하는 절대경로를 써야 한다. */
  html,body{height:100%;}
  body{display:flex; flex-direction:column; min-height:100vh;}

  .notfound{
    flex:1 1 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    max-width:460px; margin:0 auto; padding:24px 32px 72px;
  }
  .nf-code{
    font-family:'Space Mono','Noto Sans KR',monospace; font-size:11px;
    letter-spacing:1px; color:var(--ivory-muted); margin:0 0 22px;
  }
  .nf-character{width:clamp(150px,34vw,200px); margin:0 0 22px;}
  .nf-character img{
    width:100%; height:auto; display:block;
    filter:drop-shadow(4px 14px 10px rgba(0,0,0,.35));
    transform-origin:50% 88%;
    animation:nf-tilt .9s cubic-bezier(.34,1.15,.64,1) .2s both;
  }
  @keyframes nf-tilt{
    0%{transform:rotate(0deg);}
    45%{transform:rotate(-3deg);}
    100%{transform:rotate(0deg);}
  }
  .nf-shadow{
    display:block; width:60%; height:12px; margin:8px auto 0;
    border-radius:50%; background:rgba(0,0,0,.38); filter:blur(7px);
  }
  .notfound h1{
    font-family:'Black Han Sans',sans-serif; font-weight:400;
    font-size:clamp(21px,3.4vw,26px); line-height:1.4; margin:4px 0 14px; color:var(--ivory);
  }
  .nf-guide{font-size:16px; line-height:1.8; color:var(--ivory-dim); margin:0 0 4px;}
  .nf-sub{font-size:14px; line-height:1.7; color:var(--ivory-muted); margin:0 0 30px;}
  .nf-links{display:flex; align-items:center; gap:26px; flex-wrap:wrap; justify-content:center;}
  .nf-link-primary{
    font-family:'Space Mono','Noto Sans KR',monospace; font-size:12px; letter-spacing:.5px;
    color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; padding-bottom:3px;
    transition:color .2s ease, border-color .2s ease;
  }
  .nf-link-primary:hover, .nf-link-primary:focus-visible{border-color:var(--accent);}
  .nf-link-secondary{
    font-family:'Space Mono','Noto Sans KR',monospace; font-size:12px; letter-spacing:.5px;
    color:var(--ivory-dim); text-decoration:none; border-bottom:1px solid transparent; padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  .nf-link-secondary:hover, .nf-link-secondary:focus-visible{color:var(--ivory); border-color:var(--ivory-faint);}
  .nf-link-primary:focus-visible, .nf-link-secondary:focus-visible{outline:2px solid var(--accent); outline-offset:4px;}
</style>
</head>

<script>
var I18N = {
  ko: {
    aria_instagram:'인스타그램',
    aria_menu:'메뉴',
    aria_menu_close:'메뉴 닫기',
    logo_tag:'나전칠기 아티스트',
    page_title:'404 — SHIN HAEDAL',
    alt_character:'조개를 안고 있는 얼빵해달',
    title:'어라, 여기가 아닌가 봐요.',
    guide:'찾으신 페이지가 없거나 주소가 바뀌었어요.',
    sub:'얼빵해달과 함께 다른 곳으로 가볼까요?',
    link_primary:'작품 보러 가기 →',
    link_secondary:'홈으로 돌아가기 →'
  },
  en: {
    aria_instagram:'Instagram',
    aria_menu:'Menu',
    aria_menu_close:'Close menu',
    logo_tag:'Najeonchilgi Artist',
    page_title:'404 — SHIN HAEDAL',
    alt_character:'Spaced-out Sea Otter holding a shell',
    title:'Oh. This doesn’t look like the right place.',
    guide:'This page couldn’t be found. It may have moved.',
    sub:'Let’s find another way with Spaced-out Sea Otter.',
    link_primary:'Explore works →',
    link_secondary:'Back to home →'
  }
};
var LANG = 'ko';
try{
  var urlLang = new URLSearchParams(location.search).get('lang');
  if(urlLang === 'en' || urlLang === 'ko') LANG = urlLang;
  else if(localStorage.getItem('site_lang')==='en') LANG = 'en';
}catch(e){}
function applyLang(l, opts){
  opts = opts || {};
  LANG = l;
  try{ localStorage.setItem('site_lang', l); }catch(e){}
  if(!opts.skipUrl){
    try{
      var url = new URL(location.href);
      url.searchParams.set('lang', l);
      history.replaceState(null, '', url);
    }catch(e){}
  }
  document.documentElement.lang = l;
  document.title = I18N[l].page_title;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = I18N[l][el.dataset.i];
    if(v!==undefined) el.innerHTML = v;
  });
  document.querySelectorAll('[data-i-aria]').forEach(function(el){
    var v = I18N[l][el.dataset.iAria];
    if(v!==undefined) el.setAttribute('aria-label', v);
  });
  document.querySelectorAll('[data-i-alt]').forEach(function(el){
    var v = I18N[l][el.dataset.iAlt];
    if(v!==undefined) el.setAttribute('alt', v);
  });
  document.querySelectorAll('[data-i-alt]').forEach(function(el){
    var v = I18N[l][el.dataset.iAlt];
    if(v!==undefined) el.alt = v;
  });
  document.getElementById('langKo').classList.toggle('on', l==='ko');
  document.getElementById('langEn').classList.toggle('on', l==='en');
}
document.getElementById('langKo').onclick = function(){ applyLang('ko'); };
document.getElementById('langEn').onclick = function(){ applyLang('en'); };
if(LANG!=='ko') applyLang(LANG, {skipUrl:true});
</script>

<script>window.__SH_PAGE = "/404/";</script>

</body>
