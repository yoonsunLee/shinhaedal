<style>
  /* page head */
  .page-head{max-width:1180px; margin:0 auto; padding:36px 32px 10px;}
  .page-head h1{font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:clamp(30px,4.4vw,46px); margin:0;}
  .page-head p{font-family:'Space Mono', monospace; font-size:12px; color:var(--ivory-faint); margin:10px 0 0;}
  .ex-filter-row{display:flex; align-items:center; gap:10px; margin-top:22px;}
  .ex-filter-row label{font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:1px; color:var(--ivory-faint); text-transform:uppercase;}
  .ex-filter-row select{
    background:var(--bg-2); border:1px solid rgba(245,240,230,.16); border-radius:6px;
    color:var(--ivory); font-family:'Noto Sans KR',sans-serif; font-size:13px; padding:8px 11px;
    max-width:100%;
  }
  .ex-filter-notice{
    font-family:'Space Mono', monospace; font-size:11px; color:var(--gold);
    opacity:0; transition:opacity .3s ease;
  }
  .ex-filter-notice.show{opacity:1;}

  /* grid */
  .grid-section{max-width:1180px; margin:0 auto; padding:36px 32px 100px;}
  .work-grid{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:34px 14px;}
  .tile{
    display:block; width:100%; margin:0;
    cursor:pointer; border:none; background:none; padding:0; text-align:left;
    text-decoration:none; color:inherit;
    transition:transform .3s ease;
  }
  .tile:hover{transform:translateY(-3px);}
  .tile:focus-visible{outline:2px solid var(--gold); outline-offset:4px; border-radius:2px;}
  .tile-media{position:relative; aspect-ratio:1/1; overflow:hidden; border-radius:2px; background:var(--bg-2);}
  .tile-media img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s ease;}
  .tile:hover .tile-media img{transform:scale(1.03);}
  .tile-sheen{
    position:absolute; inset:0; opacity:0;
    background:
      radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1.4px) 0 0/16px 16px,
      linear-gradient(125deg,#ffb6d9,#9fe7ff,#c9b6ff,#ffd97a,#ffb6d9) 0 0/320% 320%;
    background-blend-mode:normal, screen;
    mix-blend-mode:screen;
    transition:opacity .5s ease, background-position 1.4s ease;
  }
  .tile:hover .tile-sheen{opacity:.22; background-position:0 0, 100% 60%;}
  .tile.loading{display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; border-radius:2px; background:var(--bg-2); cursor:default;}
  .tile.loading span{font-family:'Space Mono',monospace; font-size:11px; color:var(--ivory-faint);}
  .tile-cap{padding-top:12px;}
  .tile-title{font-size:13px; color:var(--ivory-dim); font-weight:500; line-height:1.4;}

  @media(max-width:720px){
    .work-grid{grid-template-columns:repeat(2, minmax(0, 1fr)); gap:26px 14px;}
  }

  /* work modal */
  .work-modal-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(5,5,8,0.86);
    display:flex; align-items:center; justify-content:center;
    padding:40px;
    opacity:0; pointer-events:none;
    transition:opacity .22s ease;
  }
  .work-modal-overlay.open{opacity:1; pointer-events:auto;}
  .work-modal{
    position:relative;
    width:100%; max-width:1040px; max-height:86vh;
    background:var(--bg-2);
    border-radius:10px;
    display:flex; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transform:translateY(14px) scale(.98);
    transition:transform .22s ease;
  }
  .work-modal-overlay.open .work-modal{transform:translateY(0) scale(1);}

  .wm-handle{display:none;}

  .wm-media{
    position:relative;
    flex:1 1 56%; background:#05050a;
    display:flex; align-items:center; justify-content:center;
    min-width:0;
  }
  .wm-media img{max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain;}

  .wm-close,.wm-nav{
    position:absolute; z-index:2;
    background:rgba(11,11,15,.55); border:none; color:var(--ivory);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    border-radius:50%; line-height:1;
  }
  .wm-close{top:12px; right:12px; width:32px; height:32px; font-size:15px;}
  .wm-nav{top:50%; transform:translateY(-50%); width:38px; height:38px; font-size:20px;}
  .wm-prev{left:12px;} .wm-next{right:12px;}
  .wm-close:hover,.wm-nav:hover{background:rgba(11,11,15,.85);}

  .wm-title-secondary{font-family:'Space Mono',monospace; font-size:12px; color:var(--ivory-faint); margin-top:5px;}
  .wm-spec{font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ivory-dim); letter-spacing:.3px;}
  .wm-caption{font-size:14px; line-height:1.7; color:var(--ivory-dim); margin:0; white-space:pre-line;}
  .wm-exhibitions{border-top:1px solid var(--gold-dim); padding-top:14px;}
  .wm-ex-label{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:var(--ivory-faint); margin-bottom:8px; text-transform:uppercase;}
  .wm-ex-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .wm-ex-list li{font-size:12.5px; color:var(--ivory-dim); line-height:1.5;}
  .wm-ex-toggle{margin-top:10px; background:none; border:none; padding:0; color:var(--gold); font-family:'Space Mono',monospace; font-size:11.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
  .wm-actions{border-top:1px solid var(--gold-dim); padding-top:14px; display:flex; gap:12px; flex-wrap:wrap;}
  .wm-action-btn{
    font-family:'Space Mono',monospace; font-size:11.5px; letter-spacing:.5px; color:var(--ivory);
    background:none; border:1px solid var(--ivory-faint); border-radius:20px; padding:9px 16px;
    cursor:pointer; transition:border-color .2s ease, color .2s ease;
  }
  .wm-action-btn:hover{border-color:var(--gold); color:var(--gold);}
  .wm-action-btn{text-decoration:none; display:inline-block;}
  .wm-action-btn--gold{border-color:var(--gold-dim); color:var(--gold);}
  .wm-action-btn--gold:hover{border-color:var(--gold); color:var(--ivory); background:var(--gold-dim);}

  .wm-series-list{display:flex; gap:10px; flex-wrap:wrap;}
  .wm-series-item{

  .wm-series-item img{width:64px; height:64px; object-fit:cover; border-radius:4px; display:block; transition:opacity .2s ease;}
  .wm-series-item:hover img{opacity:.75;}
  .wm-series-item span{display:block; font-size:10.5px; color:var(--ivory-faint); line-height:1.3; margin-top:4px;}

  .large-view-overlay{
    position:fixed; inset:0; z-index:90;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;

  .large-view-overlay img{max-width:100%; max-height:100%; object-fit:contain;}
  .lv-close{
    position:absolute; top:16px; right:16px; z-index:2;

    width:38px; height:38px; border-radius:50%; font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lv-close:hover{background:rgba(255,255,255,.18);}

  .tile-media img, #wmImg, #lvImg{
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }

  @media(max-width:820px){
    .work-modal-overlay{padding:0; align-items:flex-end;}
    .work-modal{
      max-width:none; width:100%; max-height:78vh;

    .wm-media{flex:0 0 auto; height:34vh;}
    .wm-info{max-width:none; flex:1 1 auto; padding:18px 20px 28px;}
  }
</style>

<script>
/* ---------- 언어 토글 (KO/EN) ---------- */
var I18N = {
  ko: {
    page_h:'Works',
    page_sub:'신해달의 작품을 모두 모았어요.',
    loading:'불러오는 중…',
    empty:'등록된 작품이 아직 없어요',
    error:'작품을 불러오지 못했어요',
    filter_label:'전시별로 보기',
    filter_all:'전체 작품',
    filter_empty:'이 전시에는 등록된 작품이 없어요',
    filter_cleared_notice:'다른 전시의 작품이라 필터가 해제됐어요',
    wm_ex_label:'전시 이력',
    wm_ex_more:'전시 이력 더보기',
    wm_ex_collapse:'접기',
    wm_view_larger:'크게 보기 ⛶',
    wm_ask_about:'이 작품에 대해 문의하기 →',
    wm_series_label:'시리즈 작품'
  },
  en: {
    page_h:'Works',
    page_sub:'Works by Shin Haedal, collected in one place.',
    loading:'Loading…',
    empty:'No works registered yet',
    error:'Could not load works',
    filter_label:'Browse by exhibition',
    filter_all:'All works',
    filter_empty:'No works registered for this exhibition',
    filter_cleared_notice:'Cleared the filter — this work is from a different exhibition',
    wm_ex_label:'Exhibitions',
    wm_ex_more:'Show more',
    wm_ex_collapse:'Show less',
    wm_view_larger:'VIEW LARGER ⛶',
    wm_ask_about:'ASK ABOUT THIS WORK →',
    wm_series_label:'Series'
  }
};
var LANG = 'ko';
try{
  var urlLang = new URLSearchParams(location.search).get('lang');
  if(urlLang === 'en' || urlLang === 'ko') LANG = urlLang;
  else if(localStorage.getItem('site_lang')==='en') LANG = 'en';
}catch(e){}
function applyLang(l, opts){
  opts = opts || {};
  LANG = l;
  try{ localStorage.setItem('site_lang', l); }catch(e){}
  if(!opts.skipUrl){
    try{
      var url = new URL(location.href);
      url.searchParams.set('lang', l);
      history.replaceState(null, '', url);
    }catch(e){}
  }
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = I18N[l][el.dataset.i];
    if(v!==undefined) el.innerHTML = v;
  });
  document.getElementById('langKo').classList.toggle('on', l==='ko');
  document.getElementById('langEn').classList.toggle('on', l==='en');
  if(typeof renderWorkTiles==='function' && typeof VISIBLE_WORKS!=='undefined' && VISIBLE_WORKS.length) renderWorkTiles(VISIBLE_WORKS);
  if(typeof renderWorkModal==='function' && document.getElementById('workModal').classList.contains('open')) renderWorkModal();
}
document.getElementById('langKo').onclick = function(){ applyLang('ko'); };
document.getElementById('langEn').onclick = function(){ applyLang('en'); };
if(LANG!=='ko') applyLang(LANG, {skipUrl:true});
</script>

<script>
/* ---------- 해달아카이브 발행 데이터 연동 (정적 JSON, 브라우저는 더 이상 Apps Script를 직접 호출하지 않음) ---------- */
var DATA_BASE = '../data/';
var ASSET_BASE = '../';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function primaryTitle(r){
  var ko = String(r.title||'').trim();
  var en = String(r.title_en||'').trim();
  return LANG === 'en' ? (en || ko) : (ko || en);
}
function renderWorkTiles(rows){
  var grid = document.getElementById('workGrid');
  if(!rows.length){
    grid.innerHTML = '<div class="tile loading"><span data-i="empty">' + I18N[LANG].empty + '</span></div>';
    return;
  }
  grid.innerHTML = rows.map(function(r, i){
    var img = r.thumb ? ASSET_BASE + r.thumb : '';
    var media = img ? '<img src="' + img.replace(/"/g,'&quot;') + '" alt="" loading="lazy" draggable="false" onerror="this.style.visibility=\'hidden\'">' : '';
    var title = primaryTitle(r);
    return '<a class="tile" href="?w=' + encodeURIComponent(r.id) + '" data-idx="' + i + '" aria-label="' + esc(title) + '">' +
      '<div class="tile-media">' + media + '<div class="tile-sheen"></div></div>' +
      '<span class="tile-cap"><span class="tile-title">' + esc(title) + '</span></span>' +
      '</a>';
  }).join('');
}
var ALL_WORKS = [];
var VISIBLE_WORKS = [];
var EXHIBITIONS = [];
var DETAIL_CACHE = {};

// 제목 패턴으로 시리즈 판별: "POV : 출근"처럼 콜론으로 구분되거나, "저작물B"처럼
// 한글 바로 뒤에 알파벳 한 글자가 붙어 변주를 나타내는 제목만 시리즈로 묶는다.
// 주의: 아카이브에 별도 series_id 필드가 없어 순전히 제목 텍스트로 추론한다 —
// 시리즈 작품의 제목을 바꾸면(오타 수정 포함) 조율 없이 조용히 그룹이 깨진다.
function seriesKey(title){
  title = String(title||'').trim();
  var key = null;
  var colonMatch = title.match(/^(.+?)\s+:\s+/);
  if(colonMatch) key = colonMatch[1].trim();
  else{
    var letterMatch = title.match(/[ㄱ-힝][A-Za-z]$/);
    if(letterMatch) key = title.slice(0, -1).trim();
  }
  if(!key) return null;
  // "N차적"/"nn차적"처럼 앞에 n이 반복되는 표기는 같은 시리즈로 취급
  return key.replace(/^[nN]+(?=차적)/, 'n');
}
function seriesSiblings(meta){
  var key = seriesKey(meta.title);
  if(!key) return [];
  var group = ALL_WORKS.filter(function(w){ return seriesKey(w.title) === key; });
  if(group.length < 2) return [];
  return group.filter(function(w){ return w.id !== meta.id; });
}

function populateExFilter(){
  var select = document.getElementById('exFilter');
  var sorted = EXHIBITIONS.slice().sort(function(a, b){ return String(b.start_date||'').localeCompare(String(a.start_date||'')); });
  select.innerHTML = '<option value="" data-i="filter_all">' + I18N[LANG].filter_all + '</option>' +
    sorted.map(function(ex){
      return '<option value="' + esc(ex.id) + '">' + esc(ex.title) + '</option>';
    }).join('');
}
function exWorkIds(exId){
  var ex = EXHIBITIONS.find(function(e){ return e.id === exId; });
  if(!ex) return null;
  return String(ex.work_nos||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
}
function applyExFilter(exId, opts){
  opts = opts || {};
  var ids = exId ? exWorkIds(exId) : null;
  VISIBLE_WORKS = ids ? ALL_WORKS.filter(function(w){ return ids.indexOf(w.id) !== -1; }) : ALL_WORKS.slice();
  document.getElementById('exFilter').value = exId || '';
  if(!VISIBLE_WORKS.length && exId){
    document.getElementById('workGrid').innerHTML = '<div class="tile loading"><span>' + I18N[LANG].filter_empty + '</span></div>';
  }else{
    renderWorkTiles(VISIBLE_WORKS);
  }
  if(!opts.skipUrl){
    try{
      var url = new URL(location.href);
      if(exId) url.searchParams.set('ex', exId); else url.searchParams.delete('ex');
      history.replaceState(null, '', url);
    }catch(e){}
  }
}
document.getElementById('exFilter').addEventListener('change', function(){ applyExFilter(this.value); });

function loadAllWorks(){
  Promise.all([
    fetch(DATA_BASE + 'works-index.json').then(function(res){ return res.json(); }),
    fetch(DATA_BASE + 'exhibitions.json').then(function(res){ return res.json(); }).catch(function(){ return []; })
  ]).then(function(results){
      ALL_WORKS = results[0] || [];
      EXHIBITIONS = results[1] || [];
      populateExFilter();
      var urlEx = new URLSearchParams(location.search).get('ex');
      var initialEx = (urlEx && EXHIBITIONS.some(function(e){ return e.id === urlEx; })) ? urlEx : '';
      applyExFilter(initialEx, {skipUrl:true});
      openFromUrlIfPresent();
    })
    .catch(function(e){
      console.error('작품 목록을 불러오지 못했습니다:', e);
      document.getElementById('workGrid').innerHTML =
        '<div class="tile loading"><span data-i="error">' + I18N[LANG].error + '</span></div>';
    });
}
loadAllWorks();

document.getElementById('workGrid').addEventListener('click', function(e){
  var tile = e.target.closest('.tile[data-idx]');
  if(!tile) return;
  // 가운데클릭/Ctrl/Cmd/Shift-클릭은 브라우저 기본 동작(새 탭 등)을 그대로 둔다
  if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  openWorkModal(parseInt(tile.dataset.idx, 10));
});
</script>

<script>
/* ---------- 작품 상세 팝업 ---------- */
var wmModal = document.getElementById('workModal');
var wmIndex = -1;

function cleanText(s){
  return String(s==null?'':s).replace(/[\r]/g, '\n');
}
function exhibitionLines(str){
  return cleanText(str).split('\n').map(function(s){
    return s.replace(/\t+/g, '   ').trim();
  }).filter(Boolean);
}
function fetchDetail(id){
  if(DETAIL_CACHE[id]) return Promise.resolve(DETAIL_CACHE[id]);
  return fetch(DATA_BASE + 'works/' + encodeURIComponent(id) + '.json')
    .then(function(res){ return res.json(); })
    .then(function(d){ DETAIL_CACHE[id] = d; return d; });
}
function renderWorkModal(){
  var meta = VISIBLE_WORKS[wmIndex];
  if(!meta) return;
  var requestIndex = wmIndex;

  var metaKo = String(meta.title||'').trim();
  var metaEn = String(meta.title_en||'').trim();
  var metaPrimary = LANG === 'en' ? (metaEn || metaKo) : (metaKo || metaEn);
  document.getElementById('wmTitlePrimary').textContent = metaPrimary;
  document.getElementById('wmCaption').textContent = I18N[LANG].loading;
  var imgEl = document.getElementById('wmImg');
  imgEl.src = meta.thumb ? ASSET_BASE + meta.thumb : '';
  imgEl.alt = metaPrimary;
  document.getElementById('wmAskAbout').href = '../contact/?type=artwork&work=' + encodeURIComponent(meta.id);

  var seriesWrap = document.getElementById('wmSeries');
  var siblings = seriesSiblings(meta);
  if(!siblings.length){
    seriesWrap.hidden = true;
  }else{
    seriesWrap.hidden = false;
    document.getElementById('wmSeriesList').innerHTML = siblings.map(function(s){
      var sTitle = primaryTitle(s);
      var sImg = s.thumb ? ASSET_BASE + s.thumb : '';
      return '<button class="wm-series-item" type="button" data-work-id="' + esc(s.id) + '" aria-label="' + esc(sTitle) + '">' +
        (sImg ? '<img src="' + sImg.replace(/"/g,'&quot;') + '" alt="" loading="lazy" draggable="false" onerror="this.style.visibility=\'hidden\'">' : '') +
        '<span>' + esc(sTitle) + '</span>' +
        '</button>';
    }).join('');
  }

  fetchDetail(meta.id).then(function(w){
    if(wmIndex !== requestIndex) return; // 그 사이 다른 작품으로 넘어갔으면 무시

    var ko = String(w.title||metaKo||'').trim();
    var en = metaEn;
    var primary = LANG === 'en' ? (en || ko) : (ko || en);
    var secondary = LANG === 'en' ? ko : en;
    document.getElementById('wmTitlePrimary').textContent = primary;
    var secEl = document.getElementById('wmTitleSecondary');
    secEl.textContent = secondary;
    secEl.style.display = (secondary && secondary !== primary) ? '' : 'none';

    var sizeText = String(w.size==null?'':w.size).trim();
    if(sizeText && !/cm/i.test(sizeText)) sizeText += ' cm';
    var specParts = [w.material, sizeText, w.year].map(function(v){ return String(v==null?'':v).trim(); }).filter(Boolean);
    document.getElementById('wmSpec').textContent = specParts.join(' · ');

    document.getElementById('wmCaption').textContent = cleanText(w.caption);

    var exWrap = document.getElementById('wmExhibitions');
    var exList = document.getElementById('wmExList');
    var toggle = document.getElementById('wmExToggle');
    var lines = exhibitionLines(w.exhibitions);
    var LIMIT = 3;
    if(!lines.length){
      exWrap.hidden = true;
    }else{
      exWrap.hidden = false;
      exList.innerHTML = lines.map(function(l, i){
        return '<li' + (i >= LIMIT ? ' class="wm-ex-extra" hidden' : '') + '>' + esc(l) + '</li>';
      }).join('');
      if(lines.length > LIMIT){
        toggle.hidden = false;
        toggle.dataset.open = 'false';
        toggle.textContent = I18N[LANG].wm_ex_more;
      }else{
        toggle.hidden = true;
      }
    }

    var img2 = document.getElementById('wmImg');
    img2.src = w.images && w.images.detail ? ASSET_BASE + w.images.detail : img2.src;
    img2.alt = primary;
  }).catch(function(e){
    console.error('작품 상세를 불러오지 못했습니다:', e);
  });
}
function setWorkIndex(idx, historyMode){
  wmIndex = idx;
  renderWorkModal();
  var id = VISIBLE_WORKS[idx] && VISIBLE_WORKS[idx].id;
  if(id && historyMode){
    try{
      if(historyMode === 'push') history.pushState({w:id}, '', '?w=' + encodeURIComponent(id));
      else history.replaceState({w:id}, '', '?w=' + encodeURIComponent(id));
    }catch(e){}
  }
}
var wmLastFocused = null;
function getFocusable(container){
  return Array.prototype.slice.call(
    container.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')
  ).filter(function(el){ return el.offsetParent !== null; });
}
function trapFocus(e, container){
  if(e.key !== 'Tab') return;
  var focusables = getFocusable(container);
  if(!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === first){
    e.preventDefault(); last.focus();
  }else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault(); first.focus();
  }
}
function openWorkModal(idx){
  if(!VISIBLE_WORKS[idx]) return;
  wmLastFocused = document.activeElement;
  setWorkIndex(idx, 'push');
  wmModal.classList.add('open');
  wmModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('wmClose').focus();
}
var exFilterNoticeTimer = null;
function showExFilterNotice(){
  var el = document.getElementById('exFilterNotice');
  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('show'); });
  clearTimeout(exFilterNoticeTimer);
  exFilterNoticeTimer = setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.hidden = true; }, 300);
  }, 3000);
}
function openWorkById(id){
  var idx = VISIBLE_WORKS.findIndex(function(r){ return r.id === id; });
  if(idx < 0){
    if(ALL_WORKS.findIndex(function(r){ return r.id === id; }) < 0) return;
    applyExFilter('');
    idx = VISIBLE_WORKS.findIndex(function(r){ return r.id === id; });
    if(idx < 0) return;
    showExFilterNotice();
  }
  setWorkIndex(idx, 'push');
}
document.getElementById('wmSeriesList').addEventListener('click', function(e){
  var btn = e.target.closest('.wm-series-item');
  if(!btn) return;
  openWorkById(btn.dataset.workId);
});
function closeWorkModal(){
  wmModal.classList.remove('open');
  wmModal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  try{ history.pushState({}, '', location.pathname); }catch(e){}
  if(wmLastFocused){ wmLastFocused.focus(); wmLastFocused = null; }
}
function stepWorkModal(delta){
  if(!VISIBLE_WORKS.length) return;
  setWorkIndex((wmIndex + delta + VISIBLE_WORKS.length) % VISIBLE_WORKS.length, 'replace');
}
function openFromUrlIfPresent(){
  var params = new URLSearchParams(location.search);
  var w = params.get('w');
  if(!w) return;
  var idx = VISIBLE_WORKS.findIndex(function(r){ return r.id === w; });
  if(idx < 0){
    // 현재 필터에 없는 작품이면 필터를 해제하고 다시 찾음
    if(ALL_WORKS.findIndex(function(r){ return r.id === w; }) < 0) return;
    applyExFilter('');
    idx = VISIBLE_WORKS.findIndex(function(r){ return r.id === w; });
    if(idx < 0) return;
  }
  wmIndex = idx;
  renderWorkModal();
  wmModal.classList.add('open');
  wmModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('wmClose').focus();
}
function handlePopState(){
  var w = new URLSearchParams(location.search).get('w');
  if(w){
    var idx = VISIBLE_WORKS.findIndex(function(r){ return r.id === w; });
    if(idx < 0 && ALL_WORKS.findIndex(function(r){ return r.id === w; }) >= 0){
      applyExFilter('');
      idx = VISIBLE_WORKS.findIndex(function(r){ return r.id === w; });
    }
    if(idx >= 0){
      wmIndex = idx;
      renderWorkModal();
      if(!wmModal.classList.contains('open')){
        wmLastFocused = document.activeElement;
        wmModal.classList.add('open');
        wmModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
      return;
    }
  }
  // ?w= 없거나 못 찾은 작품 -> 열려 있으면 히스토리는 건드리지 않고 닫기만
  if(wmModal.classList.contains('open')){
    wmModal.classList.remove('open');
    wmModal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if(wmLastFocused){ wmLastFocused.focus(); wmLastFocused = null; }
  }
}
window.addEventListener('popstate', handlePopState);
document.getElementById('wmClose').onclick = closeWorkModal;
document.getElementById('wmPrev').onclick = function(){ stepWorkModal(-1); };
document.getElementById('wmNext').onclick = function(){ stepWorkModal(1); };
wmModal.addEventListener('click', function(e){ if(e.target === wmModal) closeWorkModal(); });
document.getElementById('wmExToggle').onclick = function(){
  var isOpen = this.dataset.open === 'true';
  document.querySelectorAll('#wmExList .wm-ex-extra').forEach(function(li){ li.hidden = isOpen; });
  this.dataset.open = isOpen ? 'false' : 'true';
  this.textContent = isOpen ? I18N[LANG].wm_ex_more : I18N[LANG].wm_ex_collapse;
};
document.addEventListener('keydown', function(e){
  if(lvOverlay.classList.contains('open')){
    if(e.key === 'Escape') closeLargeView();
    else if(e.key === 'Tab') trapFocus(e, lvOverlay);
    return;
  }
  if(!wmModal.classList.contains('open')) return;
  if(e.key === 'Escape') closeWorkModal();
  else if(e.key === 'ArrowLeft') stepWorkModal(-1);
  else if(e.key === 'ArrowRight') stepWorkModal(1);
  else if(e.key === 'Tab') trapFocus(e, wmModal);
});

/* ---------- 크게 보기 (Large View) ---------- */
var lvOverlay = document.getElementById('largeView');
var lvImg = document.getElementById('lvImg');
var lvLastFocused = null;
document.getElementById('wmViewLarger').onclick = function(){
  var meta = VISIBLE_WORKS[wmIndex];
  var w = meta && DETAIL_CACHE[meta.id];
  var src = w && w.images && (w.images.large || w.images.detail);
  if(!src) return;
  lvLastFocused = document.activeElement;
  lvImg.src = ASSET_BASE + src;
  lvImg.alt = document.getElementById('wmTitlePrimary').textContent;
  lvOverlay.classList.add('open');
  lvOverlay.setAttribute('aria-hidden', 'false');
  document.getElementById('lvClose').focus();
};
function closeLargeView(){
  lvOverlay.classList.remove('open');
  lvOverlay.setAttribute('aria-hidden', 'true');
  lvImg.src = '';
  if(lvLastFocused){ lvLastFocused.focus(); lvLastFocused = null; }
}
document.getElementById('lvClose').onclick = closeLargeView;
lvOverlay.addEventListener('click', function(e){ if(e.target === lvOverlay) closeLargeView(); });

/* ---------- 작품 이미지 저장/드래그 캐주얼 방지 ---------- */
document.addEventListener('contextmenu', function(e){
  if(e.target.closest('.tile-media img, #wmImg, #lvImg')) e.preventDefault();
});
</script>

<script src="../assets/site.js"></script>
</body>
