<style>
  /* press hero */
  .press-hero{position:relative; overflow:hidden; min-height:46vh; display:flex; align-items:flex-end;}
  .press-hero-bg{
    position:absolute; inset:0; z-index:0;
    background-image:url('assets/press-hero.webp');
    background-size:cover; background-position:center 38%;
    animation:pressHeroZoom 22s ease-in-out infinite alternate;
  }
  @keyframes pressHeroZoom{ from{transform:scale(1);} to{transform:scale(1.02);} }
  .press-hero-overlay{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(to bottom, rgba(5,5,10,.35) 0%, rgba(5,5,10,.55) 55%, rgba(5,5,10,.92) 100%);
  }
  .press-hero-inner{position:relative; z-index:2; max-width:900px; margin:0 auto; width:100%; padding:0 32px 40px;}
  .press-hero-inner h1{font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:clamp(30px,4.4vw,46px); margin:0; color:var(--ivory);}
  .press-hero-inner p{font-family:'Space Mono', monospace; font-size:12px; color:var(--ivory-faint); margin:10px 0 0;}
  @media(max-width:720px){ .press-hero{min-height:38vh;} }

  /* press feed */
  .press-feed{max-width:900px; margin:0 auto; padding:50px 32px 130px; display:flex; flex-direction:column; gap:96px;}
  .press-card{display:grid; grid-template-columns:280px 1fr; gap:44px; align-items:center;}
  .press-card:nth-child(even){grid-template-columns:1fr 280px;}
  .press-card:nth-child(even) .press-media{order:2;}
  .press-media{position:relative; border-radius:4px; overflow:hidden; aspect-ratio:4/5; background:var(--bg-2);}
  .press-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .press-outlet-tag{
    position:absolute; left:12px; top:12px;
    background:rgba(11,11,15,.72); color:var(--ivory);
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px;
    padding:5px 10px; border-radius:20px; text-transform:uppercase;
  }
  .press-body{position:relative;}
  .press-mark{font-family:'Black Han Sans',sans-serif; font-size:74px; color:var(--gold); opacity:.4; line-height:1; margin:0 0 -26px -3px;}
  .press-quote{font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:clamp(21px,2.5vw,29px); line-height:1.45; margin:0 0 22px; color:var(--ivory);}
  .press-meta{display:flex; align-items:center; gap:10px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:var(--ivory-faint); text-transform:uppercase; margin:0 0 14px;}
  .press-meta .dot{width:3px; height:3px; border-radius:50%; background:var(--ivory-faint); flex:none;}
  .press-title{font-size:15px; color:var(--ivory-dim); font-weight:500; line-height:1.6; margin:0 0 20px;}
  .press-links{display:flex; flex-wrap:wrap; gap:8px 20px;}
  .press-link{font-family:'Space Mono',monospace; font-size:12px; color:var(--gold); text-decoration:underline; text-underline-offset:4px;}
  .press-empty{font-family:'Space Mono',monospace; font-size:12px; color:var(--ivory-faint); text-align:center; padding:60px 0;}

  @media(max-width:720px){
    .press-card, .press-card:nth-child(even){grid-template-columns:1fr; gap:22px;}
    .press-card:nth-child(even) .press-media{order:0;}
    .press-media{aspect-ratio:16/10;}
    .press-feed{gap:64px;}
  }
</style>

<div class="press-hero">
  <div class="press-hero-bg" aria-hidden="true"></div>

  <div class="press-hero-inner">
    <h1 data-i="page_h">Press</h1>

<section class="press-feed" id="pressFeed"><p class="press-empty" data-i="loading">불러오는 중…</p></section>

<script>
var PRESS_ITEMS = null; // null = 아직 로드 전

var I18N = {
  ko: { page_h:'Press', page_sub:'신해달을 다룬 기사와 매체 소개.', press_link:'기사 원문 보기 ↗', ex_link:'전시 작품 보기 →', shop_link:'브랜드 샵 바로가기 ↗', loading:'불러오는 중…', empty:'아직 등록된 기사가 없어요', error:'기사를 불러오지 못했어요' },
  en: { page_h:'Press', page_sub:'Articles and features covering Shin Haedal.', press_link:'Read the article ↗', ex_link:'See exhibited works →', shop_link:'Visit the brand shop ↗', loading:'Loading…', empty:'No press coverage yet', error:'Could not load press coverage' }
};
var LANG = 'ko';
try{
  var urlLang = new URLSearchParams(location.search).get('lang');
  if(urlLang === 'en' || urlLang === 'ko') LANG = urlLang;
  else if(localStorage.getItem('site_lang')==='en') LANG = 'en';
}catch(e){}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function archiveImgUrl(v, size){
  v = String(v||'').trim();
  if(!v) return '';
  var m;
  if(/^drive:/.test(v)) return 'https://drive.google.com/thumbnail?id=' + v.slice(6) + '&sz=w' + (size||900);
  m = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|thumbnail\?id=)([\w-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w' + (size||900);
  if(/^https?:\/\//.test(v)) return v;
  return '';
}
var EXHIBITIONS = [];
function safeUrl(v){
  // 아카이브 데이터가 손상되더라도 href에 javascript: 등 위험한 스킴이 들어가지 않도록 https만 허용
  return /^https:\/\//i.test(String(v||'').trim()) ? v : '';
}
var BRAND_SHOP_URL = 'https://www.idus.com/v2/artist/b987fcad-fa10-4f28-a90d-8553dbaab0ad/product';
// 주의: 아래 두 매칭 함수는 press.title 문자열에 브랜드명/전시명이 그대로 들어있는지로
// 판단한다(전용 필드 없음) — 기사 제목이 브랜드/전시명을 그대로 안 쓰면(의역된 헤드라인 등)
// 조용히 매칭에 실패해서 "전시 작품 보기"/"브랜드 샵" 링크가 안 뜬다.
function matchBrandShop(p){
  return /해달자개/.test(String(p.title||'')) ? BRAND_SHOP_URL : null;
}
function matchExhibition(p){
  var title = String(p.title||'');
  for(var i = 0; i < EXHIBITIONS.length; i++){
    var t = String(EXHIBITIONS[i].title||'').replace(/\s*(단체전|개인전|아트페어)$/,'').trim();
    if(t && title.indexOf(t) !== -1) return EXHIBITIONS[i];
  }
  return null;
}
function loadPress(){
  Promise.all([
    fetch('../data/press.json').then(function(res){ return res.json(); }),
    fetch('../data/exhibitions.json').then(function(res){ return res.json(); }).catch(function(){ return []; })
  ]).then(function(results){
      PRESS_ITEMS = (results[0] || []).slice().sort(function(a, b){ return String(b.date||'').localeCompare(String(a.date||'')); }); // 최신 날짜순
      EXHIBITIONS = results[1] || [];
      renderPress();
    })
    .catch(function(e){
      console.error('Press 기사를 불러오지 못했습니다:', e);
      PRESS_ITEMS = [];
      document.getElementById('pressFeed').innerHTML = '<p class="press-empty">' + I18N[LANG].error + '</p>';
    });
}
function renderPress(){
  var feed = document.getElementById('pressFeed');
  if(PRESS_ITEMS === null){
    feed.innerHTML = '<p class="press-empty">' + I18N[LANG].loading + '</p>';
    return;
  }
  if(!PRESS_ITEMS.length){
    feed.innerHTML = '<p class="press-empty">' + I18N[LANG].empty + '</p>';
    return;
  }
  feed.innerHTML = PRESS_ITEMS.map(function(p){
    p = Object.assign({}, p, { image: archiveImgUrl(p.image) });
    var img = p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '';
    var shop = matchBrandShop(p);
    var ex = shop ? null : matchExhibition(p);
    var exLink = shop
      ? '<a class="press-link" href="' + esc(safeUrl(shop)) + '" target="_blank" rel="noopener">' + esc(I18N[LANG].shop_link) + '</a>'
      : (ex ? '<a class="press-link" href="../works/?ex=' + encodeURIComponent(ex.id) + '">' + esc(I18N[LANG].ex_link) + '</a>' : '');
    var articleUrl = safeUrl(p.url);
    var articleLink = articleUrl ? '<a class="press-link" href="' + esc(articleUrl) + '" target="_blank" rel="noopener">' + esc(I18N[LANG].press_link) + '</a>' : '';
    return '<article class="press-card">' +
      '<div class="press-media">' + img + '<span class="press-outlet-tag">' + esc(p.outlet) + '</span></div>' +
      '<div class="press-body">' +
        '<div class="press-mark" aria-hidden="true">“</div>' +
        '<p class="press-quote">' + esc(p.quote) + '</p>' +
        '<div class="press-meta"><span>' + esc(p.outlet) + '</span><span class="dot"></span><span>' + esc(p.date) + '</span></div>' +
        '<h2 class="press-title">' + esc(p.title) + '</h2>' +
        '<div class="press-links">' +
          articleLink +
          exLink +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('');
}
function applyLang(l, opts){
  opts = opts || {};
  LANG = l;
  try{ localStorage.setItem('site_lang', l); }catch(e){}
  if(!opts.skipUrl){
    try{
      var url = new URL(location.href);
      url.searchParams.set('lang', l);
      history.replaceState(null, '', url);
    }catch(e){}
  }
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = I18N[l][el.dataset.i];
    if(v!==undefined) el.innerHTML = v;
  });
  document.getElementById('langKo').classList.toggle('on', l==='ko');
  document.getElementById('langEn').classList.toggle('on', l==='en');
  renderPress();
}
document.getElementById('langKo').onclick = function(){ applyLang('ko'); };
document.getElementById('langEn').onclick = function(){ applyLang('en'); };
loadPress();
if(LANG!=='ko') applyLang(LANG, {skipUrl:true});
</script>
