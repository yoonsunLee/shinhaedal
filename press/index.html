  /* press intro — 간결한 제목 영역 (기존 대형 Hero 대체) */
  .press-intro{max-width:900px; margin:0 auto; padding:56px 32px 8px;}
  .press-intro h1{font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:clamp(28px,4vw,40px); margin:0; color:var(--ivory);}
  .press-intro p{font-family:'Noto Sans KR',sans-serif; font-size:14.5px; color:#B8BDC4; line-height:1.7; margin:10px 0 0; max-width:560px;}
  .press-en-note{font-family:'Space Mono','Noto Sans KR',monospace; font-size:11px; color:#919AA4; margin-top:14px;}

  /* 대표 기사 */
  .press-feature{max-width:1100px; margin:0 auto; padding:36px 32px 56px; border-bottom:1px solid rgba(245,240,230,.12);}
  .press-feature-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:52px; align-items:center;}
  .press-feature-grid.no-media{grid-template-columns:1fr;}
  .press-feature-media img{width:100%; height:auto; max-height:560px; object-fit:contain; display:block; margin:0 auto;}
  .press-feature-body{display:flex; flex-direction:column; gap:14px;}
  .press-feature-meta{font-family:'Space Mono','Noto Sans KR',monospace; font-size:12px; letter-spacing:.5px; color:#919AA4; display:flex; align-items:center; gap:9px; text-transform:uppercase; margin:0;}
  .press-feature-meta .dot{width:3px; height:3px; border-radius:50%; background:#919AA4; flex:none;}
  .press-feature-title{font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:clamp(22px,2.6vw,32px); line-height:1.4; color:var(--ivory); margin:0;}
  .press-feature-title a{color:inherit; text-decoration:none;}
  .press-feature-title a:hover{text-decoration:underline; text-underline-offset:4px;}
  .press-lang-flag{font-family:'Space Mono','Noto Sans KR',monospace; font-size:10.5px; letter-spacing:.5px; color:#919AA4; border:1px solid rgba(245,240,230,.24); border-radius:20px; padding:2px 9px; margin-left:8px; white-space:nowrap; vertical-align:middle;}
  .press-feature-dek{font-family:'Noto Sans KR',sans-serif; font-size:15.5px; line-height:1.75; color:#B8BDC4; margin:0;}
  .press-feature-links{display:flex; gap:20px; margin-top:4px;}
  .press-link{font-family:'Space Mono','Noto Sans KR',monospace; font-size:12.5px; color:var(--gold); text-decoration:underline; text-underline-offset:4px; transition:color .15s ease;}
  .press-link:hover{color:#e0bb4a;}

  /* 나머지 기사 목록 */
  .press-list{max-width:1100px; margin:0 auto; padding:8px 32px 120px;}
  .press-row{display:grid; grid-template-columns:76px 1fr auto; gap:24px; align-items:center; padding:26px 0; border-bottom:1px solid rgba(245,240,230,.12);}
  .press-row.no-media{grid-template-columns:1fr auto;}
  .press-row-media{width:76px; height:76px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .press-row-media img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
  .press-row-text{min-width:0;}
  .press-row-meta{font-family:'Space Mono','Noto Sans KR',monospace; font-size:11px; letter-spacing:.5px; color:#919AA4; display:flex; align-items:center; gap:8px; text-transform:uppercase; margin:0 0 6px;}
  .press-row-meta .dot{width:3px; height:3px; border-radius:50%; background:#919AA4; flex:none;}
  .press-row-title{font-family:'Noto Sans KR',sans-serif; font-weight:500; font-size:16.5px; line-height:1.5; color:var(--ivory); margin:0;}
  .press-row-dek{font-family:'Noto Sans KR',sans-serif; font-size:14px; color:#B8BDC4; line-height:1.6; margin:6px 0 0;}
  .press-row-links{display:flex; flex-direction:column; gap:6px; align-items:flex-end; white-space:nowrap;}
  .press-empty{font-family:'Space Mono','Noto Sans KR',monospace; font-size:12px; color:#919AA4; text-align:center; padding:60px 0;}

  /* 대표 기사에만 적용하는 짧은 1회 등장 효과 */
  .reveal-once{opacity:1; transform:none;}
  .motion-ready .reveal-once{animation:pressReveal .6s ease both;}
  @keyframes pressReveal{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
  @media(prefers-reduced-motion:reduce){
    .motion-ready .reveal-once{animation:none; opacity:1; transform:none;}
  }

  @media(max-width:720px){
    .press-intro{padding:44px 24px 4px;}
    .press-feature{padding:28px 24px 40px;}
    .press-feature-grid{grid-template-columns:1fr; gap:22px;}
    .press-list{padding:4px 24px 90px;}
    .press-row, .press-row.no-media{grid-template-columns:1fr; gap:12px; padding:22px 0;}
    .press-row-media{width:88px; height:88px;}
    .press-row-links{flex-direction:row; align-items:center; gap:16px; white-space:normal;}
  }
</style>

<script>
var PRESS_ITEMS = null; // null = 아직 로드 전

var I18N = {
  ko: { logo_tag:'나전칠기 아티스트', page_h:'Press', page_sub:'저의 작업이 다른 시선으로 읽히고 소개된 기록입니다.', press_link:'기사 원문 보기 ↗', ex_link:'전시 작품 보기 →', shop_link:'브랜드 샵 바로가기 ↗', loading:'불러오는 중…', empty:'아직 등록된 기사가 없어요', error:'기사를 불러오지 못했어요', ko_flag:'', en_note:'', page_title:'Press — 신해달 나전칠기 아티스트' },
  en: { logo_tag:'Najeonchilgi Artist', page_h:'Press', page_sub:'Press coverage of my work and artistic practice.', press_link:'Read the article ↗', ex_link:'See exhibited works →', shop_link:'Visit the brand shop ↗', loading:'Loading…', empty:'No press coverage yet', error:'Could not load press coverage', ko_flag:'Article in Korean', en_note:'Article titles are translated for this website.', page_title:'Press — Shin Haedal, Najeonchilgi Artist' }
};
var LANG = 'ko';
try{
  var urlLang = new URLSearchParams(location.search).get('lang');
  if(urlLang === 'en' || urlLang === 'ko') LANG = urlLang;
  else if(localStorage.getItem('site_lang')==='en') LANG = 'en';
}catch(e){}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function archiveImgUrl(v, size){
  v = String(v||'').trim();
  if(!v) return '';
  var m;
  if(/^drive:/.test(v)) return 'https://drive.google.com/thumbnail?id=' + v.slice(6) + '&sz=w' + (size||900);
  m = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|thumbnail\?id=)([\w-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w' + (size||900);
  if(/^https?:\/\//.test(v)) return v;
  return '';
}
var EXHIBITIONS = [];
function safeUrl(v){
  // 아카이브 데이터가 손상되더라도 href에 javascript: 등 위험한 스킴이 들어가지 않도록 https만 허용
  return /^https:\/\//i.test(String(v||'').trim()) ? v : '';
}
var BRAND_SHOP_URL = 'https://www.idus.com/v2/artist/b987fcad-fa10-4f28-a90d-8553dbaab0ad/product';
// 아카이브의 link_type/linked_exhibition_id가 있으면 그걸 그대로 쓴다.
// 이 필드가 비어있는 옛 기사만 title 문자열 매칭으로 대체한다(의역된 헤드라인이면
// 조용히 실패할 수 있는 폴백 방식 — link_type을 채우면 이 문제가 사라진다).
function matchBrandShop(p){
  if(p.link_type) return p.link_type === 'brand_shop' ? BRAND_SHOP_URL : null;
  return /해달자개/.test(String(p.title||'')) ? BRAND_SHOP_URL : null;
}
function matchExhibition(p){
  if(p.link_type){
    if(p.link_type !== 'exhibition' || !p.linked_exhibition_id) return null;
    for(var j = 0; j < EXHIBITIONS.length; j++){
      if(EXHIBITIONS[j].id === p.linked_exhibition_id) return EXHIBITIONS[j];
    }
    return null;
  }
  var title = String(p.title||'');
  for(var i = 0; i < EXHIBITIONS.length; i++){
    var t = String(EXHIBITIONS[i].title||'').replace(/\s*(단체전|개인전|아트페어)$/,'').trim();
    if(t && title.indexOf(t) !== -1) return EXHIBITIONS[i];
  }
  return null;
}
// 사이트에서 지어낸 "N인의 참여작가 중 한 명으로 이름을 올리다" 류의 정형 문구는
// 기사 원문에 없는 요약일 뿐 직접 인용이 아니므로 목록에서 굳이 반복하지 않는다.
function isGenericMention(q){
  return /중\s*한\s*명으로\s*이름을\s*올리다/.test(q||'');
}
function isRedundantWithTitle(q, t){
  return !!(q && t && String(t).indexOf(q) !== -1);
}
function dekFor(p, title){
  var q = LANG === 'en' ? (p.quote_en||'') : (p.quote||'');
  if(!q) return '';
  if(isGenericMention(q)) return '';
  if(isRedundantWithTitle(q, title)) return '';
  return q;
}
function langFlag(p){
  return (LANG === 'en' && !p.title_en) ? '<span class="press-lang-flag">' + esc(I18N.en.ko_flag) + '</span>' : '';
}
function linksFor(p){
  var shop = matchBrandShop(p);
  var ex = shop ? null : matchExhibition(p);
  var links = [];
  var articleUrl = safeUrl(p.url);
  if(articleUrl) links.push('<a class="press-link" href="' + esc(articleUrl) + '" target="_blank" rel="noopener">' + esc(I18N[LANG].press_link) + '</a>');
  if(shop) links.push('<a class="press-link" href="' + esc(safeUrl(shop)) + '" target="_blank" rel="noopener">' + esc(I18N[LANG].shop_link) + '</a>');
  else if(ex) links.push('<a class="press-link" href="../works/?ex=' + encodeURIComponent(ex.id) + '">' + esc(I18N[LANG].ex_link) + '</a>');
  return links;
}
function pickFeatured(items){
  for(var i = 0; i < items.length; i++){ if(items[i].featured) return items[i]; }
  return items[0]; // 대표로 지정된 기사가 없으면(또는 지정된 기사를 쓸 수 없으면) 최신 기사로 대신한다
}
function onMediaError(img){
  var wrap = img.closest('.press-feature-media, .press-row-media');
  if(!wrap) return;
  var grid = wrap.closest('.press-feature-grid, .press-row');
  wrap.remove();
  if(grid) grid.classList.add('no-media');
}
function renderFeatured(p){
  var img = archiveImgUrl(p.image);
  var title = LANG === 'en' ? (p.title_en || p.title) : p.title;
  var articleUrl = safeUrl(p.url);
  var titleHtml = articleUrl ? '<a href="' + esc(articleUrl) + '" target="_blank" rel="noopener">' + esc(title) + '</a>' : esc(title);
  var dek = dekFor(p, title);
  var media = img ? '<div class="press-feature-media"><img src="' + esc(img) + '" alt="" onerror="onMediaError(this)"></div>' : '';
  return '<div class="press-feature-grid reveal-once' + (img ? '' : ' no-media') + '">' +
    media +
    '<div class="press-feature-body">' +
      '<p class="press-feature-meta"><span>' + esc(p.outlet) + '</span><span class="dot"></span><span>' + esc(p.date) + '</span></p>' +
      '<h2 class="press-feature-title">' + titleHtml + langFlag(p) + '</h2>' +
      (dek ? '<p class="press-feature-dek">' + esc(dek) + '</p>' : '') +
      '<div class="press-feature-links">' + linksFor(p).join('') + '</div>' +
    '</div>' +
  '</div>';
}
function renderRow(p){
  var img = archiveImgUrl(p.image);
  var title = LANG === 'en' ? (p.title_en || p.title) : p.title;
  var dek = dekFor(p, title);
  var media = img ? '<div class="press-row-media"><img src="' + esc(img) + '" alt="" loading="lazy" onerror="onMediaError(this)"></div>' : '';
  return '<article class="press-row' + (img ? '' : ' no-media') + '">' +
    media +
    '<div class="press-row-text">' +
      '<p class="press-row-meta"><span>' + esc(p.outlet) + '</span><span class="dot"></span><span>' + esc(p.date) + '</span></p>' +
      '<h3 class="press-row-title">' + esc(title) + langFlag(p) + '</h3>' +
      (dek ? '<p class="press-row-dek">' + esc(dek) + '</p>' : '') +
    '</div>' +
    '<div class="press-row-links">' + linksFor(p).join('') + '</div>' +
  '</article>';
}
function loadPress(){
  Promise.all([
    fetch('../data/press.json').then(function(res){ return res.json(); }),
    fetch('../data/exhibitions.json').then(function(res){ return res.json(); }).catch(function(){ return []; })
  ]).then(function(results){
      PRESS_ITEMS = (results[0] || []).slice().sort(function(a, b){ return String(b.date||'').localeCompare(String(a.date||'')); }); // 최신 날짜순
      EXHIBITIONS = results[1] || [];
      renderPress();
    })
    .catch(function(e){
      console.error('Press 기사를 불러오지 못했습니다:', e);
      document.getElementById('pressFeature').innerHTML = '';
      document.getElementById('pressList').innerHTML = '<p class="press-empty">' + I18N[LANG].error + '</p>';
    });
}
function renderPress(){
  var featureEl = document.getElementById('pressFeature');
  var listEl = document.getElementById('pressList');
  if(PRESS_ITEMS === null){
    featureEl.innerHTML = '<p class="press-empty">' + I18N[LANG].loading + '</p>';
    listEl.innerHTML = '';
    return;
  }
  if(!PRESS_ITEMS.length){
    featureEl.innerHTML = '';
    listEl.innerHTML = '<p class="press-empty">' + I18N[LANG].empty + '</p>';
    return;
  }
  var featured = pickFeatured(PRESS_ITEMS);
  var rest = PRESS_ITEMS.filter(function(p){ return p !== featured; });
  featureEl.innerHTML = renderFeatured(featured);
  listEl.innerHTML = rest.map(renderRow).join('');
}
function applyLang(l, opts){
  opts = opts || {};
  LANG = l;
  try{ localStorage.setItem('site_lang', l); }catch(e){}
  if(!opts.skipUrl){
    try{
      var url = new URL(location.href);
      url.searchParams.set('lang', l);
      history.replaceState(null, '', url);
    }catch(e){}
  }
  document.documentElement.lang = l;
  document.title = I18N[l].page_title;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = I18N[l][el.dataset.i];
    if(v!==undefined) el.innerHTML = v;
  });
  var note = document.getElementById('enNote');
  note.hidden = !I18N[l].en_note;
  document.getElementById('langKo').classList.toggle('on', l==='ko');
  document.getElementById('langEn').classList.toggle('on', l==='en');
  renderPress();
}
document.getElementById('langKo').onclick = function(){ applyLang('ko'); };
document.getElementById('langEn').onclick = function(){ applyLang('en'); };
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.classList.add('motion-ready');
loadPress();
if(LANG!=='ko') applyLang(LANG, {skipUrl:true});
</script>

<script src="../assets/ip-nav-transition.js"></script>
