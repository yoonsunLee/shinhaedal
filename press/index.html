<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press — SHIN HAEDAL</title>
<meta name="description" content="신해달을 다룬 기사와 매체 소개.">
<meta property="og:type" content="website">
<meta property="og:title" content="Press — SHIN HAEDAL">
<meta property="og:description" content="신해달을 다룬 기사와 매체 소개.">
<meta property="og:image" content="https://shinhaedal.art/haedal/assets/og_character.jpg">
<meta property="og:url" content="https://shinhaedal.art/press/">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://shinhaedal.art/press/">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0f;
    --bg-2:#111420;
    --navy:#1b2a4a;
    --gold:#c9a227;
    --gold-dim:rgba(201,162,39,0.35);
    --ivory:#f5f0e6;
    --ivory-dim:rgba(245,240,230,0.62);
    --ivory-faint:rgba(245,240,230,0.32);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
      scroll-behavior:auto !important;
    }
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ivory);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* nav */
  nav{
    position:relative; z-index:3;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:26px 32px; max-width:1180px; margin:0 auto;
  }
  .logo-block{display:flex; flex-direction:column; gap:5px;}
  .logo{font-family:'Black Han Sans', sans-serif; font-size:20px; letter-spacing:1px; color:var(--ivory); text-decoration:none;}
  .nav-icons{display:flex; align-items:center; gap:16px; padding-top:2px;}
  .lang{display:flex; border:1px solid var(--ivory-faint); border-radius:20px; overflow:hidden;}
  .lang button{border:none; background:transparent; color:var(--ivory-dim); cursor:pointer; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:6px 12px;}
  .lang button.on{background:var(--ivory); color:var(--bg);}
  .nav-menu{display:flex; gap:24px; list-style:none; margin:0 8px 0 0; padding:0; align-items:center;}
  .nav-menu a{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.5px; color:var(--ivory-dim); text-decoration:none;}
  .nav-menu a:hover, .nav-menu a.on{color:var(--ivory);}
  .nav-menu .soon{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.5px; color:var(--ivory-faint); cursor:default;}
  .menu-btn{display:none;}
  .nav-overlay{position:fixed; inset:0; background:rgba(6,7,12,.97); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center;}
  .nav-overlay.open{display:flex;}
  .overlay-close{position:absolute; top:22px; right:24px; font-size:20px;}
  .overlay-links{display:flex; flex-direction:column; gap:26px; text-align:center;}
  .overlay-links a, .overlay-links .soon{font-family:'Black Han Sans',sans-serif; font-size:26px; color:var(--ivory); text-decoration:none;}
  .overlay-links .soon{color:var(--ivory-faint);}
  .overlay-links .overlay-ig{font-family:'Space Mono',monospace; font-size:13px; color:var(--ivory-dim); margin-top:10px;}
  @media(max-width:720px){ .nav-menu{display:none;} .menu-btn{display:flex;} }
  .icon-btn{background:none; border:none; color:var(--ivory); cursor:pointer; display:flex; padding:4px; opacity:0.85;}
  .icon-btn:hover{opacity:1;}

  /* page head */
  .page-head{max-width:900px; margin:0 auto; padding:36px 32px 10px;}
  .page-head h1{font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:clamp(30px,4.4vw,46px); margin:0;}
  .page-head p{font-family:'Space Mono', monospace; font-size:12px; color:var(--ivory-faint); margin:10px 0 0;}

  /* press feed */
  .press-feed{max-width:900px; margin:0 auto; padding:50px 32px 130px; display:flex; flex-direction:column; gap:96px;}
  .press-card{display:grid; grid-template-columns:280px 1fr; gap:44px; align-items:center;}
  .press-card:nth-child(even){grid-template-columns:1fr 280px;}
  .press-card:nth-child(even) .press-media{order:2;}
  .press-media{position:relative; border-radius:4px; overflow:hidden; aspect-ratio:4/5; background:var(--bg-2);}
  .press-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .press-outlet-tag{
    position:absolute; left:12px; top:12px;
    background:rgba(11,11,15,.72); color:var(--ivory);
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px;
    padding:5px 10px; border-radius:20px; text-transform:uppercase;
  }
  .press-body{position:relative;}
  .press-mark{font-family:'Black Han Sans',sans-serif; font-size:74px; color:var(--gold); opacity:.4; line-height:1; margin:0 0 -26px -3px;}
  .press-quote{font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:clamp(21px,2.5vw,29px); line-height:1.45; margin:0 0 22px; color:var(--ivory);}
  .press-meta{display:flex; align-items:center; gap:10px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:var(--ivory-faint); text-transform:uppercase; margin:0 0 14px;}
  .press-meta .dot{width:3px; height:3px; border-radius:50%; background:var(--ivory-faint); flex:none;}
  .press-title{font-size:15px; color:var(--ivory-dim); font-weight:500; line-height:1.6; margin:0 0 20px;}
  .press-link{font-family:'Space Mono',monospace; font-size:12px; color:var(--gold); text-decoration:underline; text-underline-offset:4px;}
  .press-empty{font-family:'Space Mono',monospace; font-size:12px; color:var(--ivory-faint); text-align:center; padding:60px 0;}

  @media(max-width:720px){
    .press-card, .press-card:nth-child(even){grid-template-columns:1fr; gap:22px;}
    .press-card:nth-child(even) .press-media{order:0;}
    .press-media{aspect-ratio:16/10;}
    .press-feed{gap:64px;}
  }
</style>
</head>
<body>

<nav>
  <div class="logo-block">
    <a class="logo" href="../">ⓒSHIN HAEDAL</a>
  </div>
  <div class="nav-icons">
    <ul class="nav-menu">
      <li><a href="../">Home</a></li>
      <li><a href="../works/">Works</a></li>
      <li><a href="../about/">About</a></li>
      <li><a href="../haedal/">Haedal</a></li>
      <li><a href="./" class="on">Press</a></li>
      <li><a href="../contact/">Contact</a></li>
    </ul>
    <div class="lang" role="group" aria-label="Language">
      <button id="langKo" class="on">KO</button>
      <button id="langEn">EN</button>
    </div>
    <a class="icon-btn" aria-label="인스타그램" href="https://www.instagram.com/haedal_space/" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></svg>
    </a>
    <button class="icon-btn menu-btn" id="btnMenu" aria-label="메뉴">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6H17M3 10H17M3 14H17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="nav-overlay" id="navOverlay">
    <button class="icon-btn overlay-close" id="btnMenuClose" aria-label="닫기">✕</button>
    <nav class="overlay-links">
      <a href="../">Home</a>
      <a href="../works/">Works</a>
      <a href="../about/">About</a>
      <a href="../haedal/">Haedal</a>
      <a href="./">Press</a>
      <a href="../contact/">Contact</a>
      <a href="https://www.instagram.com/haedal_space/" target="_blank" rel="noopener" class="overlay-ig">Instagram ↗</a>
    </nav>
  </div>
</nav>

<div class="page-head">
  <h1 data-i="page_h">Press</h1>
  <p data-i="page_sub">신해달을 다룬 기사와 매체 소개.</p>
</div>

<section class="press-feed" id="pressFeed"><p class="press-empty" data-i="loading">불러오는 중…</p></section>

<script>
var PRESS_ITEMS = null; // null = 아직 로드 전

var I18N = {
  ko: { page_h:'Press', page_sub:'신해달을 다룬 기사와 매체 소개.', press_link:'기사 원문 보기 ↗', loading:'불러오는 중…', empty:'아직 등록된 기사가 없어요', error:'기사를 불러오지 못했어요' },
  en: { page_h:'Press', page_sub:'Articles and features covering Shin Haedal.', press_link:'Read the article ↗', loading:'Loading…', empty:'No press coverage yet', error:'Could not load press coverage' }
};
var LANG = 'ko';
try{ if(localStorage.getItem('site_lang')==='en') LANG='en'; }catch(e){}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function archiveImgUrl(v, size){
  v = String(v||'').trim();
  if(!v) return '';
  var m;
  if(/^drive:/.test(v)) return 'https://drive.google.com/thumbnail?id=' + v.slice(6) + '&sz=w' + (size||900);
  m = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|thumbnail\?id=)([\w-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w' + (size||900);
  if(/^https?:\/\//.test(v)) return v;
  return '';
}
function loadPress(){
  fetch('../data/press.json?t=' + Date.now())
    .then(function(res){ return res.json(); })
    .then(function(rows){
      PRESS_ITEMS = (rows || []).slice().reverse(); // 최근 등록순(시트 하단이 최신)
      renderPress();
    })
    .catch(function(e){
      console.error('Press 기사를 불러오지 못했습니다:', e);
      PRESS_ITEMS = [];
      document.getElementById('pressFeed').innerHTML = '<p class="press-empty">' + I18N[LANG].error + '</p>';
    });
}
function renderPress(){
  var feed = document.getElementById('pressFeed');
  if(PRESS_ITEMS === null){
    feed.innerHTML = '<p class="press-empty">' + I18N[LANG].loading + '</p>';
    return;
  }
  if(!PRESS_ITEMS.length){
    feed.innerHTML = '<p class="press-empty">' + I18N[LANG].empty + '</p>';
    return;
  }
  feed.innerHTML = PRESS_ITEMS.map(function(p){
    p = Object.assign({}, p, { image: archiveImgUrl(p.image) });
    return '<article class="press-card">' +
      '<div class="press-media"><img src="' + esc(p.image) + '" alt="" loading="lazy"><span class="press-outlet-tag">' + esc(p.outlet) + '</span></div>' +
      '<div class="press-body">' +
        '<div class="press-mark" aria-hidden="true">“</div>' +
        '<p class="press-quote">' + esc(p.quote) + '</p>' +
        '<div class="press-meta"><span>' + esc(p.outlet) + '</span><span class="dot"></span><span>' + esc(p.date) + '</span></div>' +
        '<h2 class="press-title">' + esc(p.title) + '</h2>' +
        '<a class="press-link" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(I18N[LANG].press_link) + '</a>' +
      '</div>' +
    '</article>';
  }).join('');
}
function applyLang(l){
  LANG = l;
  try{ localStorage.setItem('site_lang', l); }catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i]').forEach(function(el){
    var v = I18N[l][el.dataset.i];
    if(v!==undefined) el.innerHTML = v;
  });
  document.getElementById('langKo').classList.toggle('on', l==='ko');
  document.getElementById('langEn').classList.toggle('on', l==='en');
  renderPress();
}
document.getElementById('langKo').onclick = function(){ applyLang('ko'); };
document.getElementById('langEn').onclick = function(){ applyLang('en'); };
loadPress();
if(LANG!=='ko') applyLang(LANG);
</script>

<script>
(function(){
  var ov=document.getElementById('navOverlay');
  document.getElementById('btnMenu').onclick=function(){ov.classList.add('open');};
  document.getElementById('btnMenuClose').onclick=function(){ov.classList.remove('open');};
  ov.querySelectorAll('a').forEach(function(a){a.onclick=function(){ov.classList.remove('open');};});
})();
</script>
</body>
</html>
